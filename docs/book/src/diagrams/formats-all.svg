<svg width="700" height="400" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.8"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text x="125" y="30" text-anchor="middle" fill="#c0cadb" font-size="13">PyTorch / HF lineage</text>
  <text x="350" y="30" text-anchor="middle" fill="#c0cadb" font-size="13">llama.cpp lineage</text>
  <text x="575" y="30" text-anchor="middle" fill="#c0cadb" font-size="13">cross-framework</text>

  <!-- pickle .bin -->
  <rect x="25" y="46" width="200" height="120" rx="10" fill="rgba(139,152,169,0.05)" stroke="#8b98a9" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="125" y="70" text-anchor="middle" fill="#c0cadb">pytorch_model.bin</text>
  <text x="125" y="92" text-anchor="middle" font-size="11" opacity="0.8">folder + json sidecars</text>
  <text x="125" y="110" text-anchor="middle" font-size="11" fill="#cc5555" opacity="0.9">Python pickle: runs code on load</text>
  <text x="125" y="132" text-anchor="middle" font-size="11" opacity="0.7">PyTorch, 2016</text>
  <text x="125" y="150" text-anchor="middle" font-size="11" opacity="0.7">the old HF default</text>

  <path d="M 125 166 v 42" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrL)"/>
  <text x="138" y="192" font-size="11" opacity="0.7">replaced by</text>

  <!-- safetensors -->
  <rect x="25" y="212" width="200" height="120" rx="10" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="125" y="236" text-anchor="middle" fill="#c0cadb">model.safetensors</text>
  <text x="125" y="258" text-anchor="middle" font-size="11" opacity="0.8">folder + json sidecars</text>
  <text x="125" y="276" text-anchor="middle" font-size="11" opacity="0.8">no code, mmap-friendly</text>
  <text x="125" y="298" text-anchor="middle" font-size="11" opacity="0.7">Hugging Face, 2022</text>
  <text x="125" y="316" text-anchor="middle" font-size="11" fill="#9dc49d">the HF default; Part II reads it</text>

  <!-- GGML/GGJT -->
  <rect x="250" y="46" width="200" height="120" rx="10" fill="rgba(139,152,169,0.05)" stroke="#8b98a9" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="350" y="70" text-anchor="middle" fill="#c0cadb">GGML / GGJT</text>
  <text x="350" y="92" text-anchor="middle" font-size="11" opacity="0.8">one file, quantized</text>
  <text x="350" y="110" text-anchor="middle" font-size="11" opacity="0.8">no versioned metadata</text>
  <text x="350" y="132" text-anchor="middle" font-size="11" opacity="0.7">llama.cpp, early 2023</text>
  <text x="350" y="150" text-anchor="middle" font-size="11" opacity="0.7">superseded</text>

  <path d="M 350 166 v 42" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrL)"/>
  <text x="363" y="192" font-size="11" opacity="0.7">replaced by</text>

  <!-- GGUF -->
  <rect x="250" y="212" width="200" height="120" rx="10" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="350" y="236" text-anchor="middle" fill="#c0cadb">model.gguf</text>
  <text x="350" y="258" text-anchor="middle" font-size="11" opacity="0.8">one file: metadata KV + tensors</text>
  <text x="350" y="276" text-anchor="middle" font-size="11" opacity="0.8">has a written spec</text>
  <text x="350" y="298" text-anchor="middle" font-size="11" opacity="0.7">llama.cpp, Aug 2023</text>
  <text x="350" y="316" text-anchor="middle" font-size="11" fill="#9dc49d">local/quantized default; Part III</text>

  <!-- ONNX -->
  <rect x="475" y="46" width="200" height="120" rx="10" fill="rgba(139,152,169,0.05)" stroke="#8b98a9" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="575" y="70" text-anchor="middle" fill="#c0cadb">model.onnx</text>
  <text x="575" y="92" text-anchor="middle" font-size="11" opacity="0.8">compute graph + weights</text>
  <text x="575" y="110" text-anchor="middle" font-size="11" opacity="0.8">in one protobuf file</text>
  <text x="575" y="132" text-anchor="middle" font-size="11" opacity="0.7">Microsoft + Meta, 2017</text>
  <text x="575" y="150" text-anchor="middle" font-size="11" opacity="0.7">deployment interchange</text>

  <!-- container vs content note -->
  <rect x="475" y="212" width="200" height="120" rx="10" fill="rgba(224,164,88,0.06)" stroke="#e0a458" stroke-opacity="0.6"/>
  <text x="575" y="240" text-anchor="middle" fill="#f0c893" font-size="12">not containers:</text>
  <text x="575" y="262" text-anchor="middle" font-size="11" opacity="0.85">GPTQ, AWQ = quantization</text>
  <text x="575" y="280" text-anchor="middle" font-size="11" opacity="0.85">methods; their repos still</text>
  <text x="575" y="298" text-anchor="middle" font-size="11" opacity="0.85">ship safetensors holding</text>
  <text x="575" y="316" text-anchor="middle" font-size="11" opacity="0.85">quantized values</text>

  <text x="350" y="380" text-anchor="middle" font-size="12" opacity="0.75">solid blue = the two nucleon reads; dashed = met in the wild, not read by us</text>
</svg>
