<svg width="740" height="440" viewBox="0 0 740 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b98a9">
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0a458" opacity="0.85"/>
    </marker>
  </defs>

  <!-- lane headers -->
  <text x="140" y="28" text-anchor="middle" font-weight="bold" fill="#a9b6c6">Rust on the CPU</text>
  <text x="390" y="28" text-anchor="middle" font-weight="bold" fill="#c0cadb">unified memory</text>
  <text x="620" y="28" text-anchor="middle" font-weight="bold" fill="#c98a6b">GPU</text>
  <g stroke-opacity="0.25" stroke="#8b98a9">
    <path d="M 140 38 V 420" stroke-dasharray="3 5"/>
    <path d="M 390 38 V 420" stroke-dasharray="3 5"/>
    <path d="M 620 38 V 420" stroke-dasharray="3 5"/>
  </g>

  <!-- 1 copy input -->
  <rect x="30" y="48" width="220" height="36" rx="7" fill="rgba(70,130,180,0.15)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="140" y="70" text-anchor="middle">1. buffer_from_f32(x)</text>
  <path d="M 252 66 H 300" stroke="#e0a458" stroke-opacity="0.7" fill="none" marker-end="url(#arrO)"/>
  <rect x="304" y="48" width="172" height="36" rx="7" fill="rgba(70,130,180,0.22)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="390" y="70" text-anchor="middle">x lands in a buffer</text>

  <!-- 2 pipeline lookup -->
  <rect x="30" y="100" width="220" height="36" rx="7" fill="rgba(70,130,180,0.15)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="140" y="122" text-anchor="middle">2. pipelines["silu"]</text>
  <text x="268" y="122" font-size="11" opacity="0.7">compiled once at startup</text>

  <!-- 3 encode -->
  <rect x="30" y="152" width="220" height="50" rx="7" fill="rgba(70,130,180,0.15)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="140" y="172" text-anchor="middle">3. encoder records:</text>
  <text x="140" y="190" text-anchor="middle" font-size="11" opacity="0.8">pipeline + buffers + grid size</text>

  <!-- 4 commit -->
  <rect x="30" y="218" width="220" height="36" rx="7" fill="rgba(224,164,88,0.18)" stroke="#e0a458" stroke-opacity="0.7"/>
  <text x="140" y="240" text-anchor="middle" fill="#f0c893">4. commit()</text>
  <path d="M 252 236 C 380 236, 480 236, 552 250" stroke="#e0a458" stroke-opacity="0.8" fill="none" marker-end="url(#arrO)"/>

  <!-- 5 GPU executes -->
  <rect x="520" y="254" width="200" height="70" rx="7" fill="rgba(183,65,14,0.15)" stroke="#b7410e" stroke-opacity="0.7"/>
  <text x="620" y="276" text-anchor="middle" fill="#c98a6b">5. n threads run the</text>
  <text x="620" y="293" text-anchor="middle" fill="#c98a6b">silu body, one per i</text>
  <text x="620" y="312" text-anchor="middle" font-size="11" opacity="0.8">reads x, writes out</text>
  <path d="M 516 278 C 470 278, 440 278, 412 278" stroke="#b7410e" stroke-opacity="0.6" fill="none" marker-end="url(#arrO)" marker-start="url(#arrO)"/>
  <rect x="304" y="260" width="104" height="36" rx="7" fill="rgba(70,130,180,0.22)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="356" y="282" text-anchor="middle" font-size="11">x, out</text>

  <!-- 6 wait -->
  <rect x="30" y="270" width="220" height="36" rx="7" fill="rgba(70,130,180,0.08)" stroke="#4682b4" stroke-opacity="0.4"/>
  <text x="140" y="292" text-anchor="middle" opacity="0.7">6. waitUntilCompleted()</text>
  <text x="140" y="320" text-anchor="middle" font-size="11" opacity="0.6">CPU is blocked here</text>
  <path d="M 552 328 C 460 344, 330 344, 254 344" stroke="#b7410e" stroke-opacity="0.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrO)"/>
  <text x="400" y="360" text-anchor="middle" font-size="11" opacity="0.7">done signal unblocks the wait</text>

  <!-- 7 read back -->
  <rect x="30" y="376" width="220" height="36" rx="7" fill="rgba(70,130,180,0.15)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="140" y="398" text-anchor="middle">7. read_f32(out)</text>
  <path d="M 300 394 H 252" stroke="#e0a458" stroke-opacity="0.7" fill="none" marker-end="url(#arrO)"/>
  <rect x="304" y="376" width="172" height="36" rx="7" fill="rgba(70,130,180,0.22)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="390" y="398" text-anchor="middle">result copied out</text>
</svg>
