<svg width="720" height="440" viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.8"/>
    </marker>
  </defs>

  <text x="240" y="28" text-anchor="middle" fill="#c0cadb" font-size="14">encode: text to ids</text>
  <text x="600" y="28" text-anchor="middle" fill="#c0cadb" font-size="14">decode: ids to text</text>

  <!-- encode pipeline, top to bottom -->
  <rect x="90" y="44" width="300" height="34" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="240" y="65" text-anchor="middle" font-size="12" fill="#c0cadb">input string</text>

  <path d="M 240 78 v 12" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrP)"/>

  <rect x="90" y="94" width="300" height="46" rx="8" fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="240" y="113" text-anchor="middle" font-size="12" fill="#9dc49d">1. added-token scan</text>
  <text x="240" y="130" text-anchor="middle" font-size="11" opacity="0.75">specials matched whole, bypass the rest</text>

  <path d="M 240 140 v 12" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrP)"/>

  <rect x="90" y="156" width="300" height="46" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="240" y="175" text-anchor="middle" font-size="12" fill="#c0cadb">2. pre-tokenizer</text>
  <text x="240" y="192" text-anchor="middle" font-size="11" opacity="0.75">qwen2 regex splits text into pieces</text>

  <path d="M 240 202 v 12" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrP)"/>

  <rect x="90" y="218" width="300" height="46" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="240" y="237" text-anchor="middle" font-size="12" fill="#c0cadb">3. byte-level alphabet</text>
  <text x="240" y="254" text-anchor="middle" font-size="11" opacity="0.75">every byte becomes one of 256 characters</text>

  <path d="M 240 264 v 12" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrP)"/>

  <rect x="90" y="280" width="300" height="46" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="240" y="299" text-anchor="middle" font-size="12" fill="#c0cadb">4. BPE model</text>
  <text x="240" y="316" text-anchor="middle" font-size="11" opacity="0.75">merges by rank, then vocab lookup</text>

  <path d="M 240 326 v 12" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrP)"/>

  <rect x="90" y="342" width="300" height="34" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="240" y="363" text-anchor="middle" font-size="12" fill="#f0c893">ids: Vec&lt;u32&gt;</text>

  <!-- decode pipeline, bottom to top -->
  <rect x="450" y="342" width="300" height="34" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8" transform="translate(-30 0)"/>
  <text x="570" y="363" text-anchor="middle" font-size="12" fill="#f0c893">ids from the sampler</text>

  <path d="M 570 342 v -12" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrP)"/>

  <rect x="420" y="284" width="300" height="46" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="570" y="303" text-anchor="middle" font-size="12" fill="#c0cadb">5. decoder</text>
  <text x="570" y="320" text-anchor="middle" font-size="11" opacity="0.75">inverse byte-level mapping, ids to bytes</text>

  <path d="M 570 284 v -12" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrP)"/>

  <rect x="420" y="226" width="300" height="46" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="570" y="245" text-anchor="middle" font-size="12" fill="#c0cadb">6. UTF-8 buffering (streaming)</text>
  <text x="570" y="262" text-anchor="middle" font-size="11" opacity="0.75">withhold bytes until a codepoint completes</text>

  <path d="M 570 226 v -12" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrP)"/>

  <rect x="420" y="180" width="300" height="34" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="570" y="201" text-anchor="middle" font-size="12" fill="#c0cadb">output text, streamed in chunks</text>

  <!-- stop set, off to the side -->
  <rect x="420" y="60" width="300" height="76" rx="10" fill="rgba(139,152,169,0.05)" stroke="#8b98a9" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="570" y="84" text-anchor="middle" font-size="12" fill="#c0cadb">7. stop set (not in either pipeline)</text>
  <text x="570" y="104" text-anchor="middle" font-size="11" opacity="0.75">Vec&lt;u32&gt; carried through unchanged;</text>
  <text x="570" y="121" text-anchor="middle" font-size="11" opacity="0.75">the generation loop compares ids against it</text>

  <text x="360" y="416" text-anchor="middle" font-size="11" opacity="0.7">parts 1-4 run on encode, 5-6 on decode, 7 is a value the loop reads. Each is one section below.</text>
</svg>
