<svg width="740" height="540" viewBox="0 0 740 540" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0a458" opacity="0.8"/>
    </marker>
  </defs>

  <text x="200" y="26" text-anchor="middle" font-weight="bold" fill="#c0cadb">the package (physical)</text>

  <!-- DRAM left -->
  <rect x="20" y="60" width="54" height="150" rx="6" fill="rgba(70,130,180,0.20)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="47" y="130" text-anchor="middle" font-size="11" transform="rotate(-90 47 135)">LPDDR5 DRAM</text>
  <rect x="20" y="230" width="54" height="150" rx="6" fill="rgba(70,130,180,0.20)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="47" y="300" text-anchor="middle" font-size="11" transform="rotate(-90 47 305)">LPDDR5 DRAM</text>

  <!-- die -->
  <rect x="100" y="50" width="300" height="340" rx="10" fill="rgba(70,130,180,0.05)" stroke="#4682b4" stroke-opacity="0.8"/>
  <text x="250" y="74" text-anchor="middle" font-size="12" fill="#a9b6c6">the M-series die (one chip)</text>

  <!-- CPU block -->
  <rect x="120" y="88" width="120" height="70" rx="6" fill="rgba(70,130,180,0.15)" stroke="#4682b4" stroke-opacity="0.5"/>
  <text x="180" y="120" text-anchor="middle" font-size="12">CPU cores</text>
  <text x="180" y="140" text-anchor="middle" font-size="11" opacity="0.7">P + E clusters</text>

  <!-- ANE -->
  <rect x="260" y="88" width="120" height="70" rx="6" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.4"/>
  <text x="320" y="120" text-anchor="middle" font-size="12" opacity="0.8">Neural Engine</text>
  <text x="320" y="140" text-anchor="middle" font-size="11" opacity="0.6">(separate unit)</text>

  <!-- GPU block: grid of cores -->
  <rect x="120" y="176" width="260" height="140" rx="6" fill="rgba(183,65,14,0.08)" stroke="#b7410e" stroke-opacity="0.6"/>
  <text x="250" y="196" text-anchor="middle" font-size="12" fill="#c98a6b">GPU: a grid of identical cores</text>
  <g stroke="#b7410e" stroke-opacity="0.5">
    <rect x="136" y="208" width="40" height="40" fill="rgba(183,65,14,0.25)"/>
    <rect x="184" y="208" width="40" height="40" fill="rgba(183,65,14,0.25)"/>
    <rect x="232" y="208" width="40" height="40" fill="rgba(183,65,14,0.25)"/>
    <rect x="280" y="208" width="40" height="40" fill="rgba(183,65,14,0.25)"/>
    <rect x="328" y="208" width="40" height="40" fill="rgba(183,65,14,0.35)" stroke="#e0a458" stroke-width="2"/>
    <rect x="136" y="256" width="40" height="40" fill="rgba(183,65,14,0.25)"/>
    <rect x="184" y="256" width="40" height="40" fill="rgba(183,65,14,0.25)"/>
    <rect x="232" y="256" width="40" height="40" fill="rgba(183,65,14,0.25)"/>
    <rect x="280" y="256" width="40" height="40" fill="rgba(183,65,14,0.25)"/>
    <rect x="328" y="256" width="40" height="40" fill="rgba(183,65,14,0.25)"/>
  </g>
  <text x="250" y="308" text-anchor="middle" font-size="11" opacity="0.7">8 to 80 cores depending on chip</text>

  <!-- SLC -->
  <rect x="120" y="330" width="260" height="40" rx="6" fill="rgba(70,130,180,0.18)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="250" y="355" text-anchor="middle" font-size="12">System Level Cache (shared)</text>

  <!-- DRAM connection -->
  <path d="M 78 210 H 96" stroke="#4682b4" stroke-opacity="0.6"/>
  <path d="M 78 300 H 96" stroke="#4682b4" stroke-opacity="0.6"/>

  <!-- zoom lines: stop at the card edge, never crossing its text -->
  <path d="M 368 212 C 400 180, 420 150, 446 120" stroke="#e0a458" stroke-opacity="0.5" stroke-dasharray="4 3" fill="none"/>
  <path d="M 368 244 C 405 270, 425 290, 446 300" stroke="#e0a458" stroke-opacity="0.5" stroke-dasharray="4 3" fill="none"/>

  <!-- zoomed single core -->
  <text x="586" y="26" text-anchor="middle" font-weight="bold" fill="#f0c893">inside ONE GPU core</text>
  <rect x="450" y="40" width="272" height="330" rx="10" fill="rgba(224,164,88,0.06)" stroke="#e0a458" stroke-opacity="0.7"/>

  <text x="586" y="66" text-anchor="middle" font-size="12" fill="#a9b6c6">ALU lanes, grouped in simdgroups</text>
  <g stroke="#e0a458" stroke-opacity="0.5">
    <rect x="483" y="78" width="26" height="26" fill="rgba(224,164,88,0.25)"/>
    <rect x="513" y="78" width="26" height="26" fill="rgba(224,164,88,0.25)"/>
    <rect x="543" y="78" width="26" height="26" fill="rgba(224,164,88,0.25)"/>
    <rect x="573" y="78" width="26" height="26" fill="rgba(224,164,88,0.25)"/>
    <rect x="603" y="78" width="26" height="26" fill="rgba(224,164,88,0.25)"/>
    <rect x="633" y="78" width="26" height="26" fill="rgba(224,164,88,0.25)"/>
    <rect x="663" y="78" width="26" height="26" fill="rgba(224,164,88,0.25)"/>
    <rect x="483" y="108" width="26" height="26" fill="rgba(224,164,88,0.25)"/>
    <rect x="513" y="108" width="26" height="26" fill="rgba(224,164,88,0.25)"/>
    <rect x="543" y="108" width="26" height="26" fill="rgba(224,164,88,0.25)"/>
    <rect x="573" y="108" width="26" height="26" fill="rgba(224,164,88,0.25)"/>
    <rect x="603" y="108" width="26" height="26" fill="rgba(224,164,88,0.25)"/>
    <rect x="633" y="108" width="26" height="26" fill="rgba(224,164,88,0.25)"/>
    <rect x="663" y="108" width="26" height="26" fill="rgba(224,164,88,0.25)"/>
  </g>
  <text x="586" y="160" text-anchor="middle" font-size="11" opacity="0.8">a simdgroup = 32 threads running</text>
  <text x="586" y="175" text-anchor="middle" font-size="11" opacity="0.8">the same instruction in lockstep</text>

  <rect x="470" y="192" width="232" height="44" rx="6" fill="rgba(70,130,180,0.18)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="586" y="211" text-anchor="middle" font-size="12">registers (per thread)</text>
  <text x="586" y="228" text-anchor="middle" font-size="11" opacity="0.7">fastest, tiny</text>

  <rect x="470" y="248" width="232" height="44" rx="6" fill="rgba(224,164,88,0.18)" stroke="#e0a458" stroke-opacity="0.6"/>
  <text x="586" y="267" text-anchor="middle" font-size="12" fill="#f0c893">threadgroup memory, 32 KB</text>
  <text x="586" y="284" text-anchor="middle" font-size="11" opacity="0.7">our reductions live here</text>

  <text x="586" y="320" text-anchor="middle" font-size="11" opacity="0.8">a whole threadgroup runs on ONE core;</text>
  <text x="586" y="336" text-anchor="middle" font-size="11" opacity="0.8">only group-mates can share this memory</text>

  <text x="370" y="428" text-anchor="middle" font-size="12" opacity="0.85">DRAM sits ON the package, millimeters from the die - that closeness is</text>
  <text x="370" y="446" text-anchor="middle" font-size="12" opacity="0.85">where unified memory's bandwidth comes from</text>

  <!-- speed ladder -->
  <text x="60" y="480" font-weight="bold" fill="#c0cadb" font-size="13">distance = speed:</text>
  <g font-size="12">
    <text x="60" y="504">registers</text>
    <text x="165" y="504" fill="#f0c893">&gt;</text>
    <text x="185" y="504">threadgroup memory</text>
    <text x="352" y="504" fill="#f0c893">&gt;</text>
    <text x="372" y="504">System Level Cache</text>
    <text x="537" y="504" fill="#f0c893">&gt;</text>
    <text x="557" y="504">unified DRAM</text>
  </g>
  <text x="60" y="526" font-size="11" opacity="0.7">every step outward is farther from the ALUs and slower; kernels are fast when data stays left</text>
</svg>
