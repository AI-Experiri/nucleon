<svg width="740" height="430" viewBox="0 0 740 430" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0a458" opacity="0.85"/>
    </marker>
  </defs>

  <text x="370" y="26" text-anchor="middle" font-weight="bold" fill="#c0cadb">softmax: scores in, probabilities out</text>

  <!-- plain version -->
  <text x="60" y="60" font-size="12" opacity="0.8">scores</text>
  <g stroke="#4682b4" stroke-opacity="0.5">
    <rect x="40" y="70" width="64" height="34" fill="rgba(70,130,180,0.25)"/>
    <rect x="104" y="70" width="64" height="34" fill="rgba(70,130,180,0.25)"/>
    <rect x="168" y="70" width="64" height="34" fill="rgba(70,130,180,0.25)"/>
  </g>
  <g text-anchor="middle" fill="#c0cadb" font-size="13">
    <text x="72" y="92">2.0</text><text x="136" y="92">1.0</text><text x="200" y="92">0.1</text>
  </g>

  <path d="M 240 87 h 40" stroke="#e0a458" stroke-opacity="0.7" fill="none" marker-end="url(#arrX)"/>
  <text x="260" y="76" text-anchor="middle" font-size="12" fill="#f0c893">e^x</text>

  <g stroke="#4682b4" stroke-opacity="0.5">
    <rect x="288" y="70" width="64" height="34" fill="rgba(70,130,180,0.18)"/>
    <rect x="352" y="70" width="64" height="34" fill="rgba(70,130,180,0.18)"/>
    <rect x="416" y="70" width="64" height="34" fill="rgba(70,130,180,0.18)"/>
  </g>
  <g text-anchor="middle" fill="#c0cadb" font-size="13">
    <text x="320" y="92">7.39</text><text x="384" y="92">2.72</text><text x="448" y="92">1.11</text>
  </g>
  <text x="384" y="122" text-anchor="middle" font-size="12" opacity="0.8">sum = 11.21</text>

  <path d="M 488 87 h 40" stroke="#e0a458" stroke-opacity="0.7" fill="none" marker-end="url(#arrX)"/>
  <text x="508" y="76" text-anchor="middle" font-size="11" fill="#f0c893">/ sum</text>

  <g stroke="#e0a458" stroke-opacity="0.6">
    <rect x="536" y="70" width="64" height="34" fill="rgba(224,164,88,0.20)"/>
    <rect x="600" y="70" width="64" height="34" fill="rgba(224,164,88,0.20)"/>
    <rect x="664" y="70" width="60" height="34" fill="rgba(224,164,88,0.20)"/>
  </g>
  <g text-anchor="middle" fill="#f0c893" font-size="13">
    <text x="568" y="92">0.66</text><text x="632" y="92">0.24</text><text x="694" y="92">0.10</text>
  </g>
  <text x="630" y="122" text-anchor="middle" font-size="12" opacity="0.8">sums to 1.00: probabilities</text>

  <text x="370" y="158" text-anchor="middle" font-size="12" opacity="0.85">bigger score, bigger share; every value positive; the whole row sums to 1</text>

  <!-- the problem + safe version -->
  <path d="M 40 182 H 700" stroke="#8b98a9" stroke-opacity="0.25"/>
  <text x="370" y="210" text-anchor="middle" font-weight="bold" fill="#c98a6b">the problem: real scores reach 90, and e^90 overflows f32 to infinity</text>

  <text x="370" y="238" text-anchor="middle" font-size="12" opacity="0.85">the fix used by every engine: subtract the row's max first (result is identical)</text>

  <text x="60" y="270" font-size="12" opacity="0.8">scores - max(2.0)</text>
  <g stroke="#4682b4" stroke-opacity="0.5">
    <rect x="40" y="280" width="64" height="34" fill="rgba(70,130,180,0.25)"/>
    <rect x="104" y="280" width="64" height="34" fill="rgba(70,130,180,0.25)"/>
    <rect x="168" y="280" width="64" height="34" fill="rgba(70,130,180,0.25)"/>
  </g>
  <g text-anchor="middle" fill="#c0cadb" font-size="13">
    <text x="72" y="302">0.0</text><text x="136" y="302">-1.0</text><text x="200" y="302">-1.9</text>
  </g>

  <path d="M 240 297 h 40" stroke="#e0a458" stroke-opacity="0.7" fill="none" marker-end="url(#arrX)"/>
  <text x="260" y="286" text-anchor="middle" font-size="12" fill="#f0c893">e^x</text>

  <g stroke="#4682b4" stroke-opacity="0.5">
    <rect x="288" y="280" width="64" height="34" fill="rgba(70,130,180,0.18)"/>
    <rect x="352" y="280" width="64" height="34" fill="rgba(70,130,180,0.18)"/>
    <rect x="416" y="280" width="64" height="34" fill="rgba(70,130,180,0.18)"/>
  </g>
  <g text-anchor="middle" fill="#c0cadb" font-size="13">
    <text x="320" y="302">1.00</text><text x="384" y="302">0.37</text><text x="448" y="302">0.15</text>
  </g>
  <text x="384" y="332" text-anchor="middle" font-size="12" opacity="0.8">sum = 1.52; biggest exponent is e^0 = 1</text>

  <path d="M 488 297 h 40" stroke="#e0a458" stroke-opacity="0.7" fill="none" marker-end="url(#arrX)"/>
  <text x="508" y="286" text-anchor="middle" font-size="11" fill="#f0c893">/ sum</text>

  <g stroke="#e0a458" stroke-opacity="0.6">
    <rect x="536" y="280" width="64" height="34" fill="rgba(224,164,88,0.20)"/>
    <rect x="600" y="280" width="64" height="34" fill="rgba(224,164,88,0.20)"/>
    <rect x="664" y="280" width="60" height="34" fill="rgba(224,164,88,0.20)"/>
  </g>
  <g text-anchor="middle" fill="#f0c893" font-size="13">
    <text x="568" y="302">0.66</text><text x="632" y="302">0.24</text><text x="694" y="302">0.10</text>
  </g>
  <text x="630" y="350" text-anchor="middle" font-size="12" opacity="0.8">same probabilities exactly,</text>
  <text x="630" y="366" text-anchor="middle" font-size="12" opacity="0.8">nothing overflowed</text>

  <text x="370" y="398" text-anchor="middle" font-size="12" opacity="0.85">this "subtract the max" variant is what our kernel computes: max first (one tree</text>
  <text x="370" y="416" text-anchor="middle" font-size="12" opacity="0.85">reduction), then the exponential sum (a second one), then the division</text>
</svg>
