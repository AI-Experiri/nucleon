<svg width="800" height="720" viewBox="0 0 800 720" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.85"/>
    </marker>
    <marker id="arrResHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0a458" opacity="0.95"/>
    </marker>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0cadb" opacity="0.9"/>
    </marker>
  </defs>

  <!-- ============ 1. INPUT + EMBEDDING ============ -->
  <rect x="280" y="20" width="240" height="34" rx="8"
        fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="400" y="41" text-anchor="middle" font-size="12" fill="#f0c893">ids: [seq]   (from the tokenizer)</text>

  <path d="M 400 54 L 400 70" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <rect x="280" y="74" width="240" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="400" y="93" text-anchor="middle" font-size="12" fill="#c0cadb">1. embedding (row lookup)</text>
  <text x="400" y="110" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">token_embd [151936, 1024]</text>

  <path d="M 400 120 L 400 158" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>
  <text x="480" y="140" font-size="11" fill="#8b98a9" opacity="0.75">x: [seq, 1024]</text>

  <!-- ============ 2. THE BLOCK (shown once, iteration via loop-back) ============ -->
  <rect x="100" y="164" width="600" height="292" rx="12"
        fill="rgba(139,152,169,0.06)" stroke="#8b98a9" stroke-opacity="0.65" stroke-dasharray="6 4"/>

  <text x="400" y="184" text-anchor="middle" font-size="13" fill="#c0cadb">ONE block — run SERIALLY 28 times (output of blk.N becomes input of blk.N+1)</text>
  <text x="400" y="201" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.8">same math each iteration, its own 11 weights each iteration</text>

  <!-- x lands here at the block entry -->
  <circle cx="400" cy="216" r="3" fill="#e0a458" opacity="0.95"/>

  <!-- fan out from x: down-left to col 1's norm, down-right to col 2 (via x_mid path later) -->
  <path d="M 400 216 L 400 226 L 200 226 L 200 240" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!--  COLUMN 1: attention sub-block  -->
  <text x="200" y="234" text-anchor="middle" font-size="12" fill="#9dc49d">attention sub-block (parts 2 + 3)</text>

  <!-- part 2: RMSNorm attn_norm -->
  <rect x="130" y="244" width="140" height="48" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="200" y="264" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm</text>
  <text x="200" y="281" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">attn_norm [1024]</text>

  <path d="M 200 292 L 200 308" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- part 3: attention -->
  <rect x="130" y="312" width="140" height="62" rx="8"
        fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="200" y="332" text-anchor="middle" font-size="12" fill="#9dc49d">3. attention</text>
  <text x="200" y="349" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">GQA + QK-norm + RoPE</text>
  <text x="200" y="364" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">6 tensors (9.8)</text>

  <path d="M 200 374 L 200 394" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- col 1 residual + -->
  <circle cx="200" cy="408" r="13" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.85"/>
  <text x="200" y="413" text-anchor="middle" font-size="15" fill="#f0c893">+</text>

  <!-- residual bypass 1: x -> around LEFT of col 1 -> + -->
  <path d="M 400 216 L 400 226 L 118 226 L 118 408 L 187 408"
        fill="none" stroke="#e0a458" stroke-opacity="0.6" stroke-dasharray="4 3" marker-end="url(#arrResHead)"/>
  <text x="106" y="320" font-size="10" fill="#e0a458" opacity="0.9" transform="rotate(-90 106 320)">residual (x)</text>

  <!--  flow between columns: x_mid  -->
  <path d="M 213 408 L 587 408" fill="none" stroke="#8b98a9" stroke-opacity="0.75" marker-end="url(#arrHead)"/>
  <text x="400" y="401" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">x_mid = x + attention(RMSNorm(x))</text>

  <!--  COLUMN 2: MLP sub-block  -->
  <text x="600" y="234" text-anchor="middle" font-size="12" fill="#9dc49d">MLP sub-block (parts 2 + 4)</text>

  <!-- feed column 2 norm from x_mid: tap up from the horizontal bar -->
  <path d="M 400 408 L 400 226 L 600 226 L 600 240" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- part 2: RMSNorm ffn_norm -->
  <rect x="530" y="244" width="140" height="48" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="600" y="264" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm</text>
  <text x="600" y="281" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">ffn_norm [1024]</text>

  <path d="M 600 292 L 600 308" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- part 4: SwiGLU MLP -->
  <rect x="530" y="312" width="140" height="62" rx="8"
        fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="600" y="332" text-anchor="middle" font-size="12" fill="#9dc49d">4. SwiGLU MLP</text>
  <text x="600" y="349" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">gate/up/down</text>
  <text x="600" y="364" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">1024 → 3072 → 1024</text>

  <path d="M 600 374 L 600 394" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- col 2 residual + -->
  <circle cx="600" cy="408" r="13" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.85"/>
  <text x="600" y="413" text-anchor="middle" font-size="15" fill="#f0c893">+</text>

  <!-- residual bypass 2: x_mid -> around RIGHT of col 2 -> + -->
  <path d="M 400 408 L 400 226 L 682 226 L 682 408 L 613 408"
        fill="none" stroke="#e0a458" stroke-opacity="0.6" stroke-dasharray="4 3" marker-end="url(#arrResHead)"/>
  <text x="694" y="320" font-size="10" fill="#e0a458" opacity="0.9" transform="rotate(-90 694 320)">residual (x_mid)</text>

  <!-- block output arrow: down to the loop-back split point -->
  <path d="M 600 421 L 600 442" fill="none" stroke="#8b98a9" stroke-opacity="0.7"/>

  <!-- ============ 3. LOOP-BACK for x28 (serial) ============ -->
  <path d="M 600 442 L 720 442 L 720 100 L 400 100 L 400 158"
        fill="none" stroke="#c0cadb" stroke-opacity="0.65" stroke-dasharray="8 5" marker-end="url(#arrLoop)"/>
  <rect x="742" y="260" width="46" height="24" rx="6"
        fill="rgba(139,152,169,0.20)" stroke="#c0cadb" stroke-opacity="0.7"/>
  <text x="765" y="277" text-anchor="middle" font-size="12" fill="#c0cadb">× 28</text>
  <text x="765" y="298" text-anchor="middle" font-size="10" fill="#8b98a9" opacity="0.85">serial</text>

  <!-- After all 28 iterations: forward exit -->
  <path d="M 600 442 L 400 484" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>
  <text x="500" y="472" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">after all 28 iterations</text>

  <!-- ============ 4. FINAL NORM ============ -->
  <rect x="280" y="490" width="240" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="400" y="509" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm (final)</text>
  <text x="400" y="526" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">output_norm [1024]</text>

  <path d="M 400 536 L 400 554" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- ============ 5. LM HEAD ============ -->
  <rect x="280" y="558" width="240" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="400" y="577" text-anchor="middle" font-size="12" fill="#c0cadb">6. lm head (matmul)</text>
  <text x="400" y="594" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">token_embd transposed — TIED (9.3)</text>

  <path d="M 400 604 L 400 622" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- ============ 6. LOGITS ============ -->
  <rect x="280" y="626" width="240" height="34" rx="8"
        fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="400" y="647" text-anchor="middle" font-size="12" fill="#f0c893">logits: [seq, 151936]</text>
</svg>
