<svg width="820" height="800" viewBox="0 0 820 800" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.85"/>
    </marker>
    <marker id="arrResHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0a458" opacity="0.95"/>
    </marker>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0cadb" opacity="0.9"/>
    </marker>
  </defs>

  <!-- INPUT -->
  <rect x="290" y="20" width="240" height="34" rx="8"
        fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="410" y="41" text-anchor="middle" font-size="12" fill="#f0c893">ids: [seq]   (from the tokenizer)</text>

  <path d="M 410 54 L 410 70" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- EMBEDDING -->
  <rect x="290" y="74" width="240" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="410" y="93" text-anchor="middle" font-size="12" fill="#c0cadb">1. embedding (row lookup)</text>
  <text x="410" y="110" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">token_embd [151936, 1024]</text>

  <path d="M 410 120 L 410 174" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>
  <text x="500" y="150" font-size="11" fill="#8b98a9" opacity="0.75">x: [seq, 1024]</text>

  <!-- BLOCK CONTAINER -->
  <rect x="90" y="180" width="640" height="360" rx="12"
        fill="rgba(139,152,169,0.06)" stroke="#8b98a9" stroke-opacity="0.65" stroke-dasharray="6 4"/>

  <!-- Block title -->
  <text x="410" y="204" text-anchor="middle" font-size="13" fill="#c0cadb">ONE block — run SERIALLY 28 times (output of blk.N becomes input of blk.N+1)</text>
  <text x="410" y="222" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">same math each iteration, its own 11 weights each iteration</text>

  <!-- x entry dot -->
  <circle cx="410" cy="244" r="3.5" fill="#e0a458" opacity="0.95"/>

  <!-- FAN-OUT: horizontal bar at y=252, no text near it -->
  <path d="M 410 244 L 410 252 L 210 252 L 210 300" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- SUB-BLOCK TITLES (y=278, well below the fan-out at y=252, well above the norm boxes at y=304) -->
  <text x="210" y="278" text-anchor="middle" font-size="12" fill="#9dc49d">attention sub-block (parts 2 + 3)</text>

  <!-- COL 1: RMSNorm attn_norm -->
  <rect x="140" y="304" width="140" height="48" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="210" y="324" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm</text>
  <text x="210" y="341" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">attn_norm [1024]</text>

  <path d="M 210 352 L 210 368" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- COL 1: attention -->
  <rect x="140" y="372" width="140" height="62" rx="8"
        fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="210" y="392" text-anchor="middle" font-size="12" fill="#9dc49d">3. attention</text>
  <text x="210" y="409" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">GQA + QK-norm + RoPE</text>
  <text x="210" y="424" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">6 tensors (9.8)</text>

  <path d="M 210 434 L 210 458" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- COL 1: + -->
  <circle cx="210" cy="472" r="13" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.85"/>
  <text x="210" y="477" text-anchor="middle" font-size="15" fill="#f0c893">+</text>

  <!-- RESIDUAL BYPASS 1: x -> left of col 1 -> col 1 + -->
  <path d="M 410 244 L 410 252 L 118 252 L 118 472 L 197 472"
        fill="none" stroke="#e0a458" stroke-opacity="0.6" stroke-dasharray="4 3" marker-end="url(#arrResHead)"/>
  <text x="108" y="366" font-size="10" fill="#e0a458" opacity="0.9" transform="rotate(-90 108 366)">residual (x)</text>

  <!-- x_mid flow: horizontal arrow between the two + nodes -->
  <path d="M 223 472 L 597 472" fill="none" stroke="#8b98a9" stroke-opacity="0.75" marker-end="url(#arrHead)"/>
  <text x="410" y="492" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">x_mid = x + attention(RMSNorm(x))</text>

  <!-- COL 2 title (mirror layout) -->
  <text x="610" y="278" text-anchor="middle" font-size="12" fill="#9dc49d">MLP sub-block (parts 2 + 4)</text>

  <!-- Feed col 2 from x_mid: down from x_mid bar at y=472, up to col 2's norm.
       Route: at x=390 tap UP from y=472 to y=252, then right to x=610, then down to norm top. -->
  <path d="M 390 472 L 390 252 L 610 252 L 610 300" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- COL 2: RMSNorm ffn_norm -->
  <rect x="540" y="304" width="140" height="48" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="610" y="324" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm</text>
  <text x="610" y="341" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">ffn_norm [1024]</text>

  <path d="M 610 352 L 610 368" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- COL 2: SwiGLU MLP -->
  <rect x="540" y="372" width="140" height="62" rx="8"
        fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="610" y="392" text-anchor="middle" font-size="12" fill="#9dc49d">4. SwiGLU MLP</text>
  <text x="610" y="409" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">gate/up/down</text>
  <text x="610" y="424" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">1024 → 3072 → 1024</text>

  <path d="M 610 434 L 610 458" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- COL 2: + -->
  <circle cx="610" cy="472" r="13" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.85"/>
  <text x="610" y="477" text-anchor="middle" font-size="15" fill="#f0c893">+</text>

  <!-- RESIDUAL BYPASS 2: x_mid -> right of col 2 -> col 2 + -->
  <path d="M 390 472 L 390 252 L 702 252 L 702 472 L 623 472"
        fill="none" stroke="#e0a458" stroke-opacity="0.6" stroke-dasharray="4 3" marker-end="url(#arrResHead)"/>
  <text x="714" y="366" font-size="10" fill="#e0a458" opacity="0.9" transform="rotate(-90 714 366)">residual (x_mid)</text>

  <!-- BLOCK OUTPUT ARROW: from col 2 + straight down to block bottom -->
  <path d="M 610 485 L 610 528" fill="none" stroke="#8b98a9" stroke-opacity="0.7"/>

  <!-- LOOP-BACK for x28 (serial) -->
  <path d="M 610 528 L 760 528 L 760 148 L 410 148 L 410 174"
        fill="none" stroke="#c0cadb" stroke-opacity="0.65" stroke-dasharray="8 5" marker-end="url(#arrLoop)"/>

  <!-- x28 badge, sitting ON the right vertical segment of the loop -->
  <rect x="734" y="326" width="52" height="26" rx="6"
        fill="rgba(139,152,169,0.25)" stroke="#c0cadb" stroke-opacity="0.75"/>
  <text x="760" y="344" text-anchor="middle" font-size="12" fill="#c0cadb">× 28</text>
  <text x="760" y="366" text-anchor="middle" font-size="10" fill="#8b98a9" opacity="0.85">serial</text>
  <text x="760" y="380" text-anchor="middle" font-size="10" fill="#8b98a9" opacity="0.85">iterations</text>

  <!-- AFTER 28 ITERATIONS: forward exit down to final norm -->
  <path d="M 610 528 L 410 566" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>
  <text x="510" y="552" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">after all 28 iterations</text>

  <!-- FINAL RMSNORM -->
  <rect x="290" y="572" width="240" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="410" y="591" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm (final)</text>
  <text x="410" y="608" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">output_norm [1024]</text>

  <path d="M 410 618 L 410 636" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- LM HEAD -->
  <rect x="290" y="640" width="240" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="410" y="659" text-anchor="middle" font-size="12" fill="#c0cadb">6. lm head (matmul)</text>
  <text x="410" y="676" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">token_embd transposed — TIED (9.3)</text>

  <path d="M 410 686 L 410 704" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- LOGITS -->
  <rect x="290" y="708" width="240" height="34" rx="8"
        fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="410" y="729" text-anchor="middle" font-size="12" fill="#f0c893">logits: [seq, 151936]</text>
</svg>
