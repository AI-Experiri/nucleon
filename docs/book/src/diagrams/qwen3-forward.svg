<svg width="720" height="620" viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrQ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.8"/>
    </marker>
  </defs>

  <!-- input -->
  <rect x="240" y="16" width="240" height="34" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="360" y="37" text-anchor="middle" font-size="12" fill="#f0c893">ids: [seq]   (from the tokenizer)</text>

  <path d="M 360 50 v 14" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>

  <!-- embedding -->
  <rect x="240" y="68" width="240" height="46" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="360" y="87" text-anchor="middle" font-size="12" fill="#c0cadb">1. embedding (row lookup)</text>
  <text x="360" y="104" text-anchor="middle" font-size="11" opacity="0.75">token_embd [151936, 1024]</text>

  <path d="M 360 114 v 14" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>
  <text x="440" y="126" font-size="11" opacity="0.75">x: [seq, 1024]</text>

  <!-- the repeated block: two side-by-side sub-block columns -->
  <rect x="60" y="132" width="600" height="300" rx="12" fill="rgba(139,152,169,0.05)" stroke="#8b98a9" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="360" y="154" text-anchor="middle" fill="#c0cadb" font-size="13">the block, repeated 28 times (blk.0 .. blk.27)</text>

  <!-- x entering the block: fans out to both columns' residual (bypass) AND to col 1's norm -->
  <path d="M 360 132 v -18" stroke="none"/>
  <!-- residual stream (dashed orange line) enters at top, hugs left, wraps around each column to its add -->

  <!-- =============== COLUMN 1: attention sub-block =============== -->
  <text x="180" y="180" text-anchor="middle" fill="#9dc49d" font-size="12">attention sub-block (parts 2 + 3)</text>

  <!-- part 2: RMSNorm (attn_norm) -->
  <rect x="100" y="196" width="160" height="60" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="180" y="218" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm</text>
  <text x="180" y="234" text-anchor="middle" font-size="11" opacity="0.75">attn_norm [1024]</text>
  <text x="180" y="249" text-anchor="middle" font-size="11" opacity="0.75">(a copy of x)</text>

  <path d="M 180 256 v 16" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>

  <!-- part 3: attention -->
  <rect x="100" y="272" width="160" height="70" rx="8" fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="180" y="294" text-anchor="middle" font-size="12" fill="#9dc49d">3. attention</text>
  <text x="180" y="311" text-anchor="middle" font-size="11" opacity="0.75">GQA + QK-norm + RoPE</text>
  <text x="180" y="326" text-anchor="middle" font-size="11" opacity="0.75">6 tensors (9.8)</text>

  <!-- residual add for column 1 (bottom of col 1) -->
  <path d="M 180 342 v 16" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>
  <circle cx="180" cy="372" r="12" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="180" y="377" text-anchor="middle" font-size="14" fill="#f0c893">+</text>

  <!-- residual (bypass) around column 1: x from top curves down the left edge into the + -->
  <path d="M 360 128 C 80 128, 80 224, 80 372 L 168 372" stroke="#e0a458" stroke-opacity="0.45" stroke-dasharray="4 3" fill="none" marker-end="url(#arrQ)"/>
  <text x="70" y="220" font-size="10" fill="#e0a458" opacity="0.7" transform="rotate(-90 70 220)">residual (x, raw)</text>

  <!-- also drive column 1's RMSNorm from the entering x -->
  <path d="M 360 128 C 260 128, 260 176, 180 176 L 180 192" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>

  <!-- =============== flow between columns =============== -->
  <path d="M 192 372 L 328 372" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrQ)"/>
  <text x="260" y="365" text-anchor="middle" font-size="11" opacity="0.7">x_mid</text>

  <!-- =============== COLUMN 2: MLP sub-block =============== -->
  <text x="460" y="180" text-anchor="middle" fill="#9dc49d" font-size="12">MLP sub-block (parts 2 + 4)</text>

  <!-- drive column 2's RMSNorm from x_mid -->
  <path d="M 340 372 C 380 372, 380 176, 460 176 L 460 192" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>

  <!-- part 2: RMSNorm (ffn_norm) -->
  <rect x="380" y="196" width="160" height="60" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="460" y="218" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm</text>
  <text x="460" y="234" text-anchor="middle" font-size="11" opacity="0.75">ffn_norm [1024]</text>
  <text x="460" y="249" text-anchor="middle" font-size="11" opacity="0.75">(a copy of x_mid)</text>

  <path d="M 460 256 v 16" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>

  <!-- part 4: SwiGLU MLP -->
  <rect x="380" y="272" width="160" height="70" rx="8" fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="460" y="294" text-anchor="middle" font-size="12" fill="#9dc49d">4. SwiGLU MLP</text>
  <text x="460" y="311" text-anchor="middle" font-size="11" opacity="0.75">gate/up/down</text>
  <text x="460" y="326" text-anchor="middle" font-size="11" opacity="0.75">1024 -&gt; 3072 -&gt; 1024</text>

  <!-- residual add for column 2 -->
  <path d="M 460 342 v 16" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>
  <circle cx="460" cy="372" r="12" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="460" y="377" text-anchor="middle" font-size="14" fill="#f0c893">+</text>

  <!-- residual (bypass) around column 2: x_mid curves down the right edge into the + -->
  <path d="M 340 372 C 380 372, 640 224, 640 372 L 472 372" stroke="#e0a458" stroke-opacity="0.45" stroke-dasharray="4 3" fill="none" marker-end="url(#arrQ)"/>
  <text x="650" y="240" font-size="10" fill="#e0a458" opacity="0.7" transform="rotate(90 650 240)">residual (x_mid)</text>

  <!-- block output -->
  <path d="M 460 384 v 22 C 460 420, 400 420, 360 432" stroke="#8b98a9" stroke-opacity="0.7" fill="none"/>
  <path d="M 460 384 L 460 406" stroke="none"/>

  <!-- exit the block down into the final norm -->
  <path d="M 460 400 C 460 420, 400 432, 360 448" stroke="none"/>

  <!-- clean single exit arrow -->
  <path d="M 470 384 v 14" stroke="none"/>

  <!-- SIMPLER: just an arrow from + straight down through the block bottom into the final norm -->
  <path d="M 460 384 v 40" stroke="#8b98a9" stroke-opacity="0.6" fill="none"/>
  <path d="M 460 424 L 360 448" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>
  <text x="480" y="416" font-size="11" opacity="0.75">x: [seq, 1024], 28 blocks later</text>

  <!-- final norm -->
  <rect x="240" y="452" width="240" height="46" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="360" y="471" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm (final)</text>
  <text x="360" y="488" text-anchor="middle" font-size="11" opacity="0.75">output_norm [1024]</text>

  <path d="M 360 498 v 14" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>

  <!-- lm head -->
  <rect x="240" y="516" width="240" height="46" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="360" y="535" text-anchor="middle" font-size="12" fill="#c0cadb">6. lm head (matmul)</text>
  <text x="360" y="552" text-anchor="middle" font-size="11" opacity="0.75">token_embd transposed — TIED (9.3)</text>

  <path d="M 360 562 v 14" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>

  <!-- output -->
  <rect x="240" y="580" width="240" height="34" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="360" y="601" text-anchor="middle" font-size="12" fill="#f0c893">logits: [seq, 151936]</text>
</svg>
