<svg width="720" height="560" viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrQ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.8"/>
    </marker>
  </defs>

  <!-- input -->
  <rect x="240" y="16" width="240" height="34" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="360" y="37" text-anchor="middle" font-size="12" fill="#f0c893">ids: [seq]   (from the tokenizer)</text>

  <path d="M 360 50 v 14" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>

  <!-- embedding -->
  <rect x="240" y="68" width="240" height="46" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="360" y="87" text-anchor="middle" font-size="12" fill="#c0cadb">1. embedding (row lookup)</text>
  <text x="360" y="104" text-anchor="middle" font-size="11" opacity="0.75">token_embd [151936, 1024]</text>

  <path d="M 360 114 v 14" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>
  <text x="440" y="126" font-size="11" opacity="0.75">x: [seq, 1024]</text>

  <!-- the repeated block -->
  <rect x="120" y="132" width="480" height="240" rx="12" fill="rgba(139,152,169,0.05)" stroke="#8b98a9" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="360" y="154" text-anchor="middle" fill="#c0cadb" font-size="13">the block, repeated 28 times (blk.0 .. blk.27)</text>

  <!-- attn sub-block -->
  <rect x="200" y="168" width="150" height="64" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="275" y="190" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm</text>
  <text x="275" y="207" text-anchor="middle" font-size="11" opacity="0.75">attn_norm [1024]</text>
  <text x="275" y="222" text-anchor="middle" font-size="11" opacity="0.75">(a copy of x)</text>

  <path d="M 350 200 h 20" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>

  <rect x="374" y="168" width="150" height="64" rx="8" fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="449" y="190" text-anchor="middle" font-size="12" fill="#9dc49d">3. attention</text>
  <text x="449" y="207" text-anchor="middle" font-size="11" opacity="0.75">GQA + QK-norm + RoPE</text>
  <text x="449" y="222" text-anchor="middle" font-size="11" opacity="0.75">6 tensors (9.8)</text>

  <!-- residual add 1 -->
  <path d="M 524 200 C 570 200, 570 246, 530 246" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>
  <circle cx="516" cy="246" r="11" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="516" y="251" text-anchor="middle" font-size="13" fill="#f0c893">+</text>
  <text x="616" y="250" text-anchor="middle" font-size="11" opacity="0.75">x = x + delta</text>
  <path d="M 160 200 C 150 200, 150 246, 505 246" stroke="#e0a458" stroke-opacity="0.35" fill="none"/>
  <text x="168" y="240" font-size="11" opacity="0.6">residual stream (x, raw)</text>

  <!-- mlp sub-block -->
  <rect x="200" y="276" width="150" height="64" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="275" y="298" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm</text>
  <text x="275" y="315" text-anchor="middle" font-size="11" opacity="0.75">ffn_norm [1024]</text>
  <text x="275" y="330" text-anchor="middle" font-size="11" opacity="0.75">(a copy of x)</text>

  <path d="M 350 308 h 20" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>

  <rect x="374" y="276" width="150" height="64" rx="8" fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="449" y="298" text-anchor="middle" font-size="12" fill="#9dc49d">4. SwiGLU MLP</text>
  <text x="449" y="315" text-anchor="middle" font-size="11" opacity="0.75">gate/up/down</text>
  <text x="449" y="330" text-anchor="middle" font-size="11" opacity="0.75">1024 -> 3072 -> 1024</text>

  <path d="M 524 308 C 570 308, 570 354, 530 354" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>
  <circle cx="516" cy="354" r="11" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="516" y="359" text-anchor="middle" font-size="13" fill="#f0c893">+</text>
  <path d="M 160 308 C 150 308, 150 354, 505 354" stroke="#e0a458" stroke-opacity="0.35" fill="none"/>

  <path d="M 360 372 v 14" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>
  <text x="470" y="384" font-size="11" opacity="0.75">x: [seq, 1024], 28 blocks later</text>

  <!-- final norm -->
  <rect x="240" y="390" width="240" height="46" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="360" y="409" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm (final)</text>
  <text x="360" y="426" text-anchor="middle" font-size="11" opacity="0.75">output_norm [1024]</text>

  <path d="M 360 436 v 14" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>

  <!-- lm head -->
  <rect x="240" y="454" width="240" height="46" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="360" y="473" text-anchor="middle" font-size="12" fill="#c0cadb">6. lm head (matmul)</text>
  <text x="360" y="490" text-anchor="middle" font-size="11" opacity="0.75">token_embd transposed — TIED (9.3)</text>

  <path d="M 360 500 v 14" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrQ)"/>

  <!-- output -->
  <rect x="240" y="518" width="240" height="34" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="360" y="539" text-anchor="middle" font-size="12" fill="#f0c893">logits: [seq, 151936]</text>
</svg>
