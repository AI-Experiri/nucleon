<svg width="900" height="820" viewBox="0 0 900 820" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.85"/>
    </marker>
    <marker id="arrRes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0a458" opacity="0.95"/>
    </marker>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0cadb" opacity="0.9"/>
    </marker>
  </defs>

  <!-- INPUT -->
  <rect x="330" y="20" width="240" height="34" rx="8"
        fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="450" y="41" text-anchor="middle" font-size="12" fill="#f0c893">ids: [seq]   (from the tokenizer)</text>

  <path d="M 450 54 L 450 68" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- EMBEDDING -->
  <rect x="330" y="72" width="240" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="450" y="91" text-anchor="middle" font-size="12" fill="#c0cadb">1. embedding (row lookup)</text>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">token_embd [151936, 1024]</text>

  <path d="M 450 118 L 450 186" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- BLOCK CONTAINER -->
  <rect x="90" y="192" width="720" height="390" rx="12"
        fill="rgba(139,152,169,0.06)" stroke="#8b98a9" stroke-opacity="0.65" stroke-dasharray="6 4"/>

  <text x="450" y="216" text-anchor="middle" font-size="13" fill="#c0cadb">ONE block — run SERIALLY 28 times (output of blk.N becomes input of blk.N+1)</text>
  <text x="450" y="234" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">same math each iteration, its own 11 weights each iteration</text>

  <!-- x entry dot -->
  <circle cx="450" cy="260" r="4" fill="#e0a458" opacity="0.95"/>

  <!-- Fan-out (gray, solid): entry-dot down to y=272 bar, then LEFT to col 1 top, DOWN into col 1 norm -->
  <path d="M 450 260 L 450 272 L 230 272 L 230 306" fill="none" stroke="#8b98a9" stroke-opacity="0.75" marker-end="url(#arrHead)"/>

  <!-- Residual bypass (orange dashed): entry-dot down to y=272 bar, then LEFT further to x=110, DOWN to col 1 + -->
  <path d="M 450 272 L 110 272 L 110 478 L 199 478" fill="none" stroke="#e0a458" stroke-opacity="0.65" stroke-dasharray="4 3" marker-end="url(#arrRes)"/>

  <!-- COL 1 boxes -->
  <rect x="160" y="310" width="140" height="48" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="230" y="330" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm</text>
  <text x="230" y="347" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">attn_norm [1024]</text>

  <path d="M 230 358 L 230 374" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <rect x="160" y="378" width="140" height="62" rx="8"
        fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="230" y="398" text-anchor="middle" font-size="12" fill="#9dc49d">3. attention</text>
  <text x="230" y="415" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">GQA + QK-norm + RoPE</text>
  <text x="230" y="430" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">6 tensors (9.8)</text>

  <path d="M 230 440 L 230 464" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- COL 1 + -->
  <circle cx="230" cy="478" r="13" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.85"/>
  <text x="230" y="483" text-anchor="middle" font-size="15" fill="#f0c893">+</text>

  <!-- x_mid horizontal arrow between + nodes -->
  <path d="M 243 478 L 657 478" fill="none" stroke="#8b98a9" stroke-opacity="0.75" marker-end="url(#arrHead)"/>
  <text x="450" y="498" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">x_mid = x + attention(RMSNorm(x))</text>

  <!-- Fan-out from x_mid to col 2 norm: tap UP from x_mid bar, over, down into col 2 norm -->
  <path d="M 450 478 L 450 272 L 670 272 L 670 306" fill="none" stroke="#8b98a9" stroke-opacity="0.75" marker-end="url(#arrHead)"/>

  <!-- Residual bypass 2: x_mid up, right past col 2, down to col 2 + -->
  <path d="M 450 272 L 790 272 L 790 478 L 683 478" fill="none" stroke="#e0a458" stroke-opacity="0.65" stroke-dasharray="4 3" marker-end="url(#arrRes)"/>

  <!-- COL 2 boxes -->
  <rect x="600" y="310" width="140" height="48" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="670" y="330" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm</text>
  <text x="670" y="347" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">ffn_norm [1024]</text>

  <path d="M 670 358 L 670 374" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <rect x="600" y="378" width="140" height="62" rx="8"
        fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="670" y="398" text-anchor="middle" font-size="12" fill="#9dc49d">4. SwiGLU MLP</text>
  <text x="670" y="415" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">gate/up/down</text>
  <text x="670" y="430" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">1024 → 3072 → 1024</text>

  <path d="M 670 440 L 670 464" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- COL 2 + -->
  <circle cx="670" cy="478" r="13" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.85"/>
  <text x="670" y="483" text-anchor="middle" font-size="15" fill="#f0c893">+</text>

  <!-- Block output: down from col 2 + to the T-junction just above block bottom -->
  <path d="M 670 491 L 670 552" fill="none" stroke="#8b98a9" stroke-opacity="0.7"/>

  <!-- T-junction at (670, 552): two arms diverge -->
  <circle cx="670" cy="552" r="3" fill="#c0cadb" opacity="0.9"/>

  <!-- ARM 1: loop-back (× 28, serial), curves out RIGHT of the block, up, and re-enters at the x entry dot from the RIGHT -->
  <path d="M 670 552 L 850 552 L 850 260 L 468 260" fill="none" stroke="#c0cadb" stroke-opacity="0.65" stroke-dasharray="8 5" marker-end="url(#arrLoop)"/>

  <!-- × 28 badge on the loop-back's right vertical segment -->
  <rect x="822" y="392" width="56" height="26" rx="6" fill="rgba(139,152,169,0.25)" stroke="#c0cadb" stroke-opacity="0.75"/>
  <text x="850" y="410" text-anchor="middle" font-size="12" fill="#c0cadb">× 28</text>

  <!-- ARM 2: forward exit after all 28 iterations, DOWN through block bottom to final norm -->
  <path d="M 670 552 L 670 620" fill="none" stroke="#8b98a9" stroke-opacity="0.7"/>
  <path d="M 670 620 L 450 640" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>
  <text x="560" y="608" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">after all 28 iterations →</text>

  <!-- FINAL RMSNORM -->
  <rect x="330" y="646" width="240" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="450" y="665" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm (final)</text>
  <text x="450" y="682" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">output_norm [1024]</text>

  <path d="M 450 692 L 450 710" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- LM HEAD -->
  <rect x="330" y="714" width="240" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="450" y="733" text-anchor="middle" font-size="12" fill="#c0cadb">6. lm head (matmul)</text>
  <text x="450" y="750" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">token_embd transposed — TIED (9.3)</text>

  <path d="M 450 760 L 450 778" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- LOGITS -->
  <rect x="330" y="782" width="240" height="34" rx="8"
        fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="450" y="803" text-anchor="middle" font-size="12" fill="#f0c893">logits: [seq, 151936]</text>
</svg>
