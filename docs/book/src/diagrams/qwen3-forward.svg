<svg width="700" height="940" viewBox="0 0 700 940" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.85"/>
    </marker>
    <marker id="arrRes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0a458" opacity="0.95"/>
    </marker>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0cadb" opacity="0.9"/>
    </marker>
  </defs>

  <!-- INPUT -->
  <rect x="280" y="20" width="240" height="34" rx="8"
        fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="400" y="41" text-anchor="middle" font-size="12" fill="#f0c893">ids: [seq]   (from the tokenizer)</text>

  <path d="M 400 54 L 400 68" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- EMBEDDING -->
  <rect x="280" y="72" width="240" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="400" y="91" text-anchor="middle" font-size="12" fill="#c0cadb">1. embedding (row lookup)</text>
  <text x="400" y="108" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">token_embd [151936, 1024]</text>

  <path d="M 400 118 L 400 176" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- BLOCK CONTAINER -->
  <rect x="200" y="182" width="400" height="510" rx="12"
        fill="rgba(139,152,169,0.06)" stroke="#8b98a9" stroke-opacity="0.65" stroke-dasharray="6 4"/>

  <text x="400" y="206" text-anchor="middle" font-size="13" fill="#c0cadb">ONE block — SERIAL: attention first, then MLP</text>
  <text x="400" y="224" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">run 28 times: output of blk.N becomes input of blk.N+1</text>

  <!-- x entry -->
  <circle cx="400" cy="250" r="4" fill="#e0a458" opacity="0.95"/>

  <!-- ATTENTION SUB-BLOCK (parts 2 + 3) -->
  <text x="400" y="272" text-anchor="middle" font-size="12" fill="#9dc49d">attention sub-block (parts 2 + 3)</text>

  <path d="M 400 250 L 400 284" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- attn RMSNorm -->
  <rect x="320" y="288" width="160" height="48" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="400" y="308" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm</text>
  <text x="400" y="325" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">attn_norm [1024]</text>

  <path d="M 400 336 L 400 352" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- attention -->
  <rect x="320" y="356" width="160" height="62" rx="8"
        fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="400" y="376" text-anchor="middle" font-size="12" fill="#9dc49d">3. attention</text>
  <text x="400" y="393" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">GQA + QK-norm + RoPE</text>
  <text x="400" y="408" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">6 tensors (9.8)</text>

  <path d="M 400 418 L 400 442" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- residual + 1 -->
  <circle cx="400" cy="456" r="13" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.85"/>
  <text x="400" y="461" text-anchor="middle" font-size="15" fill="#f0c893">+</text>

  <!-- residual bypass 1: from x entry down and around LEFT to + -->
  <path d="M 400 250 L 400 264 L 240 264 L 240 456 L 387 456"
        fill="none" stroke="#e0a458" stroke-opacity="0.65" stroke-dasharray="4 3" marker-end="url(#arrRes)"/>

  <!-- x_mid label after first + -->
  <path d="M 400 469 L 400 490" fill="none" stroke="#8b98a9" stroke-opacity="0.7"/>
  <text x="520" y="482" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">x_mid = x + attention(RMSNorm(x))</text>

  <!-- MLP SUB-BLOCK (parts 2 + 4) -->
  <text x="400" y="508" text-anchor="middle" font-size="12" fill="#9dc49d">MLP sub-block (parts 2 + 4)</text>

  <path d="M 400 490 L 400 520" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- ffn RMSNorm -->
  <rect x="320" y="524" width="160" height="48" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="400" y="544" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm</text>
  <text x="400" y="561" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">ffn_norm [1024]</text>

  <path d="M 400 572 L 400 588" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- SwiGLU MLP -->
  <rect x="320" y="592" width="160" height="62" rx="8"
        fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="400" y="612" text-anchor="middle" font-size="12" fill="#9dc49d">4. SwiGLU MLP</text>
  <text x="400" y="629" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">gate/up/down</text>
  <text x="400" y="644" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">1024 → 3072 → 1024</text>

  <path d="M 400 654 L 400 668" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- residual + 2 -->
  <circle cx="400" cy="682" r="13" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.85"/>
  <text x="400" y="687" text-anchor="middle" font-size="15" fill="#f0c893">+</text>

  <!-- residual bypass 2: from x_mid (y=490) around RIGHT of MLP to + at y=682 -->
  <path d="M 400 490 L 560 490 L 560 682 L 413 682"
        fill="none" stroke="#e0a458" stroke-opacity="0.65" stroke-dasharray="4 3" marker-end="url(#arrRes)"/>

  <!-- T-junction below second + -->
  <path d="M 400 695 L 400 720" fill="none" stroke="#8b98a9" stroke-opacity="0.7"/>
  <circle cx="400" cy="720" r="3" fill="#c0cadb" opacity="0.9"/>

  <!-- LOOP-BACK: right arm out of block, up right side, back into x entry -->
  <path d="M 400 720 L 640 720 L 640 250 L 418 250"
        fill="none" stroke="#c0cadb" stroke-opacity="0.65" stroke-dasharray="8 5" marker-end="url(#arrLoop)"/>

  <!-- × 28 badge on loop-back right vertical -->
  <rect x="612" y="474" width="56" height="26" rx="6" fill="rgba(139,152,169,0.25)" stroke="#c0cadb" stroke-opacity="0.75"/>
  <text x="640" y="492" text-anchor="middle" font-size="12" fill="#c0cadb">× 28</text>

  <!-- FORWARD EXIT after 28 iterations: down out of block to final norm -->
  <path d="M 400 720 L 400 762" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>
  <text x="530" y="748" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">after all 28 iterations →</text>

  <!-- FINAL RMSNORM -->
  <rect x="280" y="768" width="240" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="400" y="787" text-anchor="middle" font-size="12" fill="#c0cadb">2. RMSNorm (final)</text>
  <text x="400" y="804" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">output_norm [1024]</text>

  <path d="M 400 814 L 400 832" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- LM HEAD -->
  <rect x="280" y="836" width="240" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="400" y="855" text-anchor="middle" font-size="12" fill="#c0cadb">6. lm head (matmul)</text>
  <text x="400" y="872" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.75">token_embd transposed — TIED (9.3)</text>

  <path d="M 400 882 L 400 898" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrHead)"/>

  <!-- LOGITS -->
  <rect x="280" y="902" width="240" height="34" rx="8"
        fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="400" y="923" text-anchor="middle" font-size="12" fill="#f0c893">logits: [seq, 151936]</text>
</svg>
