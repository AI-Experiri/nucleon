<svg width="620" height="250" viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8b98a9">
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.8"/>
    </marker>
  </defs>

  <!-- model code -->
  <rect x="200" y="20" width="220" height="44" rx="10" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="310" y="47" text-anchor="middle" fill="#c0cadb">model code (Qwen3, ...)</text>

  <path d="M 310 68 v 22" stroke="#8b98a9" stroke-opacity="0.8" fill="none" marker-end="url(#arrS)"/>
  <text x="325" y="86" font-size="12" opacity="0.7">backend.matmul(a, b)</text>

  <!-- the seam -->
  <rect x="200" y="96" width="220" height="44" rx="10" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="310" y="123" text-anchor="middle" fill="#f0c893">trait Backend  (the seam)</text>

  <path d="M 258 144 C 230 165, 200 172, 175 180" stroke="#8b98a9" stroke-opacity="0.8" fill="none" marker-end="url(#arrS)"/>
  <path d="M 362 144 C 390 165, 420 172, 445 180" stroke="#8b98a9" stroke-opacity="0.8" fill="none" marker-end="url(#arrS)"/>

  <!-- the two executors -->
  <rect x="40" y="184" width="220" height="44" rx="10" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="150" y="205" text-anchor="middle" fill="#c0cadb" font-size="13">CpuBackend</text>
  <text x="150" y="222" text-anchor="middle" font-size="12" opacity="0.7">loops on CPU cores</text>

  <rect x="360" y="184" width="220" height="44" rx="10" fill="rgba(183,65,14,0.10)" stroke="#b7410e" stroke-opacity="0.7"/>
  <text x="470" y="205" text-anchor="middle" fill="#c98a6b" font-size="13">MetalBackend</text>
  <text x="470" y="222" text-anchor="middle" font-size="12" opacity="0.7">kernels on the GPU (ch. 2)</text>
</svg>
