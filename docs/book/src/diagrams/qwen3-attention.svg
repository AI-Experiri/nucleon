<svg width="720" height="500" viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.8"/>
    </marker>
  </defs>

  <!-- input -->
  <rect x="240" y="14" width="240" height="34" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="360" y="35" text-anchor="middle" font-size="12" fill="#c0cadb">rmsnorm(x, attn_norm)   [seq, 1024]</text>

  <path d="M 300 48 C 240 60, 180 66, 150 76" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrA)"/>
  <path d="M 360 48 v 26" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrA)"/>
  <path d="M 420 48 C 480 60, 540 66, 570 76" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrA)"/>

  <!-- three projections -->
  <rect x="50" y="80" width="200" height="50" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="150" y="100" text-anchor="middle" font-size="12" fill="#c0cadb">Q = xn @ attn_q^T</text>
  <text x="150" y="118" text-anchor="middle" font-size="11" opacity="0.75">[seq, 2048] -> 16 heads x 128</text>

  <rect x="260" y="80" width="200" height="50" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="360" y="100" text-anchor="middle" font-size="12" fill="#c0cadb">K = xn @ attn_k^T</text>
  <text x="360" y="118" text-anchor="middle" font-size="11" opacity="0.75">[seq, 1024] -> 8 heads x 128</text>

  <rect x="470" y="80" width="200" height="50" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="570" y="100" text-anchor="middle" font-size="12" fill="#c0cadb">V = xn @ attn_v^T</text>
  <text x="570" y="118" text-anchor="middle" font-size="11" opacity="0.75">[seq, 1024] -> 8 heads x 128</text>

  <path d="M 150 130 v 16" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrA)"/>
  <path d="M 360 130 v 16" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrA)"/>
  <path d="M 570 130 v 120" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrA)"/>
  <text x="600" y="200" font-size="11" opacity="0.7">V: no norm,</text>
  <text x="600" y="215" font-size="11" opacity="0.7">no RoPE</text>

  <!-- QK-norm -->
  <rect x="50" y="150" width="200" height="46" rx="8" fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="150" y="169" text-anchor="middle" font-size="12" fill="#9dc49d">QK-norm (per head)</text>
  <text x="150" y="186" text-anchor="middle" font-size="11" opacity="0.75">attn_q_norm [128], shared x16</text>

  <rect x="260" y="150" width="200" height="46" rx="8" fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="360" y="169" text-anchor="middle" font-size="12" fill="#9dc49d">QK-norm (per head)</text>
  <text x="360" y="186" text-anchor="middle" font-size="11" opacity="0.75">attn_k_norm [128], shared x8</text>

  <path d="M 150 196 v 16" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrA)"/>
  <path d="M 360 196 v 16" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrA)"/>

  <!-- RoPE -->
  <rect x="50" y="216" width="200" height="34" rx="8" fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="150" y="237" text-anchor="middle" font-size="12" fill="#9dc49d">RoPE (base 1e6)</text>

  <rect x="260" y="216" width="200" height="34" rx="8" fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="360" y="237" text-anchor="middle" font-size="12" fill="#9dc49d">RoPE (base 1e6)</text>

  <path d="M 150 250 C 150 270, 240 278, 300 284" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrA)"/>
  <path d="M 360 250 v 30" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrA)"/>
  <path d="M 570 250 C 570 270, 480 278, 420 284" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrA)"/>

  <!-- SDPA -->
  <rect x="180" y="284" width="360" height="96" rx="10" fill="rgba(94,141,94,0.08)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="360" y="308" text-anchor="middle" font-size="12" fill="#9dc49d">scaled_dot_product_attention</text>
  <text x="360" y="328" text-anchor="middle" font-size="11" opacity="0.8">scores = Q.K / sqrt(128), causal mask, softmax, weighted V</text>
  <text x="360" y="348" text-anchor="middle" font-size="11" opacity="0.8">GQA: query heads 0,1 share KV head 0; 2,3 share 1; ...</text>
  <text x="360" y="368" text-anchor="middle" font-size="11" opacity="0.8">16 output heads x 128   ->   [seq, 16, 128]</text>

  <path d="M 360 380 v 16" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrA)"/>

  <!-- output projection -->
  <rect x="220" y="400" width="280" height="50" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="360" y="420" text-anchor="middle" font-size="12" fill="#c0cadb">concat heads @ attn_output^T</text>
  <text x="360" y="438" text-anchor="middle" font-size="11" opacity="0.75">[seq, 2048] -> [seq, 1024]</text>

  <path d="M 360 450 v 16" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrA)"/>

  <rect x="240" y="470" width="240" height="26" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="360" y="487" text-anchor="middle" font-size="12" fill="#f0c893">delta, added to the residual stream</text>
</svg>
