<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.8"/>
    </marker>
  </defs>

  <!-- file world -->
  <rect x="20" y="40" width="215" height="200" rx="12" fill="rgba(139,152,169,0.05)" stroke="#8b98a9" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="127" y="66" text-anchor="middle" fill="#c0cadb">the file world</text>
  <text x="127" y="84" text-anchor="middle" font-size="11" opacity="0.7">formats, bytes, json</text>

  <rect x="40" y="100" width="175" height="40" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="127" y="125" text-anchor="middle" font-size="12" fill="#f0c893">config.json</text>

  <rect x="40" y="156" width="175" height="56" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="127" y="180" text-anchor="middle" font-size="12" fill="#c0cadb">model.safetensors</text>
  <text x="127" y="198" text-anchor="middle" font-size="11" opacity="0.7">311 tensors, bf16</text>

  <!-- loader -->
  <path d="M 240 140 h 26" stroke="#8b98a9" stroke-opacity="0.8" fill="none" marker-end="url(#arrD)"/>
  <rect x="272" y="106" width="136" height="68" rx="10" fill="rgba(224,164,88,0.12)" stroke="#e0a458" stroke-opacity="0.9"/>
  <text x="340" y="134" text-anchor="middle" fill="#f0c893">loader</text>
  <text x="340" y="154" text-anchor="middle" font-size="11" opacity="0.8">runs once, at startup</text>
  <path d="M 413 140 h 26" stroke="#8b98a9" stroke-opacity="0.8" fill="none" marker-end="url(#arrD)"/>

  <!-- engine world -->
  <rect x="445" y="40" width="215" height="200" rx="12" fill="rgba(139,152,169,0.05)" stroke="#8b98a9" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="552" y="66" text-anchor="middle" fill="#c0cadb">the engine world</text>
  <text x="552" y="84" text-anchor="middle" font-size="11" opacity="0.7">plain types, format-blind</text>

  <rect x="465" y="100" width="175" height="40" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="552" y="125" text-anchor="middle" font-size="12" fill="#f0c893">Qwen3Config { numbers }</text>

  <rect x="465" y="156" width="175" height="56" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="552" y="180" text-anchor="middle" font-size="12" fill="#c0cadb">name -&gt; Tensor</text>
  <text x="552" y="198" text-anchor="middle" font-size="11" opacity="0.7">f32, shapes checked</text>

  <text x="340" y="278" text-anchor="middle" font-size="12" opacity="0.75">only the loader knows the format; nothing to its right can tell</text>
</svg>
