  <text x="575" y="92" text-anchor="middle" fill="#f0c893">loader</text>
  <text x="575" y="110" text-anchor="middle" font-size="12" opacity="0.7">files to Tensors</text>

  <rect x="470" y="154" width="210" height="52" rx="10" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
