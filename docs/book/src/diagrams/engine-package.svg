  <text x="575" y="260" text-anchor="middle" fill="#f0c893">chat template</text>
  <text x="575" y="278" text-anchor="middle" font-size="12" opacity="0.7">prompt to ChatML</text>

  <rect x="470" y="322" width="210" height="52" rx="10" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="575" y="344" text-anchor="middle" fill="#f0c893">the loop</text>
  <text x="575" y="362" text-anchor="middle" font-size="12" opacity="0.7">stop ids, defaults</text>

