<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.8"/>
    </marker>
  </defs>

  <!-- build steps, top to bottom -->
  <rect x="60" y="20" width="250" height="40" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="185" y="45" text-anchor="middle" fill="#c0cadb">1. fetch the package</text>

  <path d="M 185 60 v 16" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrB)"/>

  <rect x="60" y="80" width="250" height="40" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="185" y="105" text-anchor="middle" fill="#c0cadb">2. loader</text>

  <path d="M 185 120 v 16" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrB)"/>

  <rect x="60" y="140" width="250" height="40" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="185" y="165" text-anchor="middle" fill="#c0cadb">3. tokenizer</text>

  <path d="M 185 180 v 16" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrB)"/>

  <rect x="60" y="200" width="250" height="40" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="185" y="225" text-anchor="middle" fill="#c0cadb">4. chat template</text>

  <path d="M 185 240 v 16" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrB)"/>

  <rect x="60" y="260" width="250" height="40" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="185" y="285" text-anchor="middle" fill="#c0cadb">5. qwen3 forward pass</text>

  <path d="M 185 300 v 16" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrB)"/>

  <rect x="60" y="320" width="250" height="40" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="185" y="345" text-anchor="middle" fill="#f0c893">6. the loop, no cache</text>
  <text x="330" y="337" font-size="12" opacity="0.8">first tokens; record tokens/sec</text>
  <text x="330" y="353" font-size="12" opacity="0.8">= the baseline</text>

  <path d="M 185 360 v 16" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrB)"/>

  <rect x="60" y="380" width="250" height="40" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="185" y="405" text-anchor="middle" fill="#f0c893">7. golden test</text>
  <text x="330" y="397" font-size="12" opacity="0.8">ids must equal HF transformers;</text>
  <text x="330" y="413" font-size="12" opacity="0.8">mismatch: diff layer by layer</text>

  <!-- debug loop back to the forward pass -->
  <path d="M 60 400 C 20 400, 20 280, 56 280" stroke="#cc5555" stroke-opacity="0.7" fill="none" marker-end="url(#arrB)"/>
  <text x="30" y="348" font-size="11" fill="#cc5555" opacity="0.85" transform="rotate(-90 30 348)">fix, retest</text>

  <path d="M 185 420 v 16" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrB)"/>

  <!-- improvements, each measured -->
  <rect x="60" y="440" width="560" height="96" rx="10" fill="rgba(94,141,94,0.08)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="340" y="466" text-anchor="middle" fill="#9dc49d">8. improvements, one at a time, each with a before/after number</text>
  <text x="340" y="492" text-anchor="middle" font-size="12" opacity="0.85">KV cache, GPU residency, fused kernels, bf16 compute, quantized weights</text>
  <text x="340" y="516" text-anchor="middle" font-size="12" opacity="0.7">an improvement without a number does not land</text>
</svg>
