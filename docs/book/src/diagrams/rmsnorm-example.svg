<svg width="740" height="240" viewBox="0 0 740 240" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0a458" opacity="0.85"/>
    </marker>
  </defs>

  <text x="370" y="26" text-anchor="middle" font-weight="bold" fill="#c0cadb">rmsnorm: rescale a vector to a standard size, keeping its direction</text>

  <text x="104" y="66" text-anchor="middle" font-size="12" opacity="0.8">input x</text>
  <g stroke="#4682b4" stroke-opacity="0.5">
    <rect x="40" y="76" width="64" height="34" fill="rgba(70,130,180,0.25)"/>
    <rect x="104" y="76" width="64" height="34" fill="rgba(70,130,180,0.25)"/>
    <rect x="168" y="76" width="64" height="34" fill="rgba(70,130,180,0.25)"/>
  </g>
  <g text-anchor="middle" fill="#c0cadb">
    <text x="72" y="98">3.0</text><text x="136" y="98">-4.0</text><text x="200" y="98">12.0</text>
  </g>

  <path d="M 240 93 h 44" stroke="#e0a458" stroke-opacity="0.7" fill="none" marker-end="url(#arrN)"/>

  <rect x="292" y="60" width="220" height="66" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.5"/>
  <text x="402" y="82" text-anchor="middle" font-size="12">one number for the whole row:</text>
  <text x="402" y="100" text-anchor="middle" font-size="12" fill="#c0cadb">mean of squares = 56.33</text>
  <text x="402" y="118" text-anchor="middle" font-size="12" fill="#c0cadb">rms = sqrt(56.33) = 7.51</text>

  <path d="M 520 93 h 44" stroke="#e0a458" stroke-opacity="0.7" fill="none" marker-end="url(#arrN)"/>
  <text x="542" y="82" text-anchor="middle" font-size="11" fill="#f0c893">/ rms</text>

  <g stroke="#e0a458" stroke-opacity="0.6">
    <rect x="572" y="76" width="52" height="34" fill="rgba(224,164,88,0.20)"/>
    <rect x="624" y="76" width="52" height="34" fill="rgba(224,164,88,0.20)"/>
    <rect x="676" y="76" width="52" height="34" fill="rgba(224,164,88,0.20)"/>
  </g>
  <g text-anchor="middle" fill="#f0c893" font-size="12">
    <text x="598" y="98">0.40</text><text x="650" y="98">-0.53</text><text x="702" y="98">1.60</text>
  </g>
  <text x="650" y="132" text-anchor="middle" font-size="12" opacity="0.8">output: rms = 1.0</text>

  <text x="370" y="172" text-anchor="middle" font-size="12" opacity="0.85">every value divided by the SAME number: proportions preserved, scale standardized.</text>
  <text x="370" y="190" text-anchor="middle" font-size="12" opacity="0.85">models do this before layers so values never drift too large or too small;</text>
  <text x="370" y="208" text-anchor="middle" font-size="12" opacity="0.85">a small learned weight per position is multiplied in afterwards</text>
</svg>
