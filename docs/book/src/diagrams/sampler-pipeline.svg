<svg width="820" height="440" viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.85"/>
    </marker>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="14" fill="#c0cadb">One row of logits in, one id out — two paths</text>

  <!-- INPUT -->
  <rect x="290" y="50" width="240" height="34" rx="8"
        fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="410" y="71" text-anchor="middle" font-size="12" fill="#f0c893">logits: [vocab]   (last row from forward)</text>

  <!-- fork point -->
  <circle cx="410" cy="98" r="3" fill="#e0a458" opacity="0.95"/>
  <path d="M 410 84 L 410 96" fill="none" stroke="#8b98a9" stroke-opacity="0.7"/>

  <!-- LEFT branch: greedy -->
  <path d="M 410 98 L 220 98 L 220 130" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrS)"/>
  <text x="220" y="118" text-anchor="middle" font-size="11" fill="#e0a458">if T == 0.0</text>

  <rect x="120" y="134" width="200" height="46" rx="8"
        fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="220" y="153" text-anchor="middle" font-size="12" fill="#9dc49d">1. greedy</text>
  <text x="220" y="170" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">argmax(logits)</text>

  <path d="M 220 180 L 220 220 L 400 240" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrS)"/>

  <!-- RIGHT branch: pipeline -->
  <path d="M 410 98 L 600 98 L 600 130" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrS)"/>
  <text x="600" y="118" text-anchor="middle" font-size="11" fill="#e0a458">otherwise</text>

  <rect x="500" y="134" width="200" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="600" y="153" text-anchor="middle" font-size="12" fill="#c0cadb">2. temperature</text>
  <text x="600" y="170" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">scaled = logits / T</text>

  <path d="M 600 180 L 600 196" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrS)"/>

  <rect x="500" y="200" width="200" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="600" y="219" text-anchor="middle" font-size="12" fill="#c0cadb">3. top-k mask</text>
  <text x="600" y="236" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">keep top k, else → −∞</text>

  <path d="M 600 246 L 600 262" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrS)"/>

  <rect x="500" y="266" width="200" height="46" rx="8"
        fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="600" y="285" text-anchor="middle" font-size="12" fill="#c0cadb">4. top-p mask</text>
  <text x="600" y="302" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">keep prefix summing ≥ p</text>

  <path d="M 600 312 L 600 328" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrS)"/>

  <rect x="500" y="332" width="200" height="46" rx="8"
        fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="600" y="351" text-anchor="middle" font-size="12" fill="#9dc49d">5. categorical sample</text>
  <text x="600" y="368" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">softmax → draw (uses RNG key)</text>

  <path d="M 600 378 L 420 405" fill="none" stroke="#8b98a9" stroke-opacity="0.7" marker-end="url(#arrS)"/>

  <!-- OUTPUT -->
  <rect x="290" y="408" width="240" height="26" rx="8"
        fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="410" y="425" text-anchor="middle" font-size="12" fill="#f0c893">id: u32</text>
</svg>
