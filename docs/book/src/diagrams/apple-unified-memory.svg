<svg width="740" height="470" viewBox="0 0 740 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.8"/>
    </marker>
  </defs>

  <!-- panel 1: named discrete card -->
  <text x="30" y="26" font-weight="bold" fill="#c0cadb">discrete: NVIDIA RTX 4090 in a PC</text>

  <rect x="30" y="40" width="210" height="120" rx="10" fill="rgba(70,130,180,0.08)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="135" y="64" text-anchor="middle" fill="#a9b6c6">CPU</text>
  <rect x="55" y="76" width="160" height="66" rx="6" fill="rgba(70,130,180,0.20)" stroke="#4682b4" stroke-opacity="0.5"/>
  <text x="135" y="99" text-anchor="middle" font-size="12">system RAM</text>
  <text x="135" y="117" text-anchor="middle" font-size="12" opacity="0.75">64 GB DDR5</text>
  <text x="135" y="134" text-anchor="middle" font-size="12" opacity="0.75">~80 GB/s</text>

  <rect x="500" y="40" width="210" height="120" rx="10" fill="rgba(183,65,14,0.08)" stroke="#b7410e" stroke-opacity="0.6"/>
  <text x="605" y="64" text-anchor="middle" fill="#c98a6b">RTX 4090 card</text>
  <rect x="525" y="76" width="160" height="66" rx="6" fill="rgba(183,65,14,0.20)" stroke="#b7410e" stroke-opacity="0.5"/>
  <text x="605" y="99" text-anchor="middle" font-size="12">VRAM: 24 GB GDDR6X</text>
  <text x="605" y="117" text-anchor="middle" font-size="12" fill="#f0c893">~1008 GB/s</text>
  <text x="605" y="134" text-anchor="middle" font-size="11" opacity="0.75">fast, but only on-card</text>

  <path d="M 246 100 h 246" stroke="#8b98a9" stroke-opacity="0.8" marker-end="url(#arrM)" marker-start="url(#arrM)" fill="none"/>
  <text x="369" y="88" text-anchor="middle" font-size="12" fill="#c0cadb">PCIe 4.0 x16</text>
  <text x="369" y="120" text-anchor="middle" font-size="12">16 lanes x ~2 GB/s</text>
  <text x="369" y="138" text-anchor="middle" font-size="12" fill="#c98a6b">= ~32 GB/s per direction</text>

  <text x="30" y="192" font-size="12" opacity="0.8">the trap: VRAM is ~1 TB/s INSIDE the card, but every tensor entering or</text>
  <text x="30" y="210" font-size="12" opacity="0.8">leaving it crawls through the ~32 GB/s bus. (PCIe 5.0 x16, RTX 5090: ~64 GB/s.)</text>

  <!-- panel 2: Apple Silicon -->
  <text x="30" y="252" font-weight="bold" fill="#c0cadb">Apple Silicon: M2 Ultra (one chip, no bus)</text>
  <rect x="30" y="266" width="680" height="180" rx="12" fill="rgba(70,130,180,0.05)" stroke="#4682b4" stroke-opacity="0.7"/>

  <rect x="60" y="286" width="190" height="64" rx="8" fill="rgba(70,130,180,0.18)" stroke="#4682b4" stroke-opacity="0.6"/>
  <text x="155" y="313" text-anchor="middle" fill="#a9b6c6">CPU cores (24)</text>
  <text x="155" y="333" text-anchor="middle" font-size="12" opacity="0.7">performance + efficiency</text>

  <rect x="310" y="286" width="370" height="64" rx="8" fill="rgba(183,65,14,0.15)" stroke="#b7410e" stroke-opacity="0.6"/>
  <text x="495" y="313" text-anchor="middle" fill="#c98a6b">GPU cores (up to 76)</text>
  <text x="495" y="333" text-anchor="middle" font-size="12" opacity="0.7">thousands of ALU lanes</text>

  <path d="M 155 354 v 16" stroke="#8b98a9" stroke-opacity="0.8" fill="none" marker-end="url(#arrM)"/>
  <path d="M 495 354 v 16" stroke="#8b98a9" stroke-opacity="0.8" fill="none" marker-end="url(#arrM)"/>

  <rect x="60" y="376" width="620" height="52" rx="8" fill="rgba(70,130,180,0.22)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="370" y="399" text-anchor="middle" fill="#c0cadb">UNIFIED MEMORY: up to 192 GB, ~800 GB/s, one pool</text>
  <text x="370" y="418" text-anchor="middle" font-size="12" opacity="0.75">both processors address the same bytes; a "GPU buffer" is ordinary RAM</text>
</svg>
