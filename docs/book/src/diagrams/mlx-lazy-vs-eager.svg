<svg width="720" height="380" viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.8"/>
    </marker>
  </defs>

  <text x="170" y="28" text-anchor="middle" fill="#c0cadb" font-size="14">immediate (hypothetical)</text>
  <text x="170" y="46" text-anchor="middle" font-size="11" opacity="0.75">one Metal dispatch per op</text>

  <rect x="60" y="66" width="220" height="34" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="170" y="87" text-anchor="middle" font-size="12" fill="#c0cadb">square(x)  — dispatch</text>

  <path d="M 170 100 v 14" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrL)"/>

  <rect x="60" y="118" width="220" height="34" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="170" y="139" text-anchor="middle" font-size="12" fill="#c0cadb">mean(..) — dispatch</text>

  <path d="M 170 152 v 14" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrL)"/>

  <rect x="60" y="170" width="220" height="34" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="170" y="191" text-anchor="middle" font-size="12" fill="#c0cadb">rsqrt(..)  — dispatch</text>

  <path d="M 170 204 v 14" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrL)"/>

  <rect x="60" y="222" width="220" height="34" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="170" y="243" text-anchor="middle" font-size="12" fill="#c0cadb">multiply(x, ..)  — dispatch</text>

  <path d="M 170 256 v 14" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrL)"/>

  <rect x="60" y="274" width="220" height="34" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="170" y="295" text-anchor="middle" font-size="12" fill="#c0cadb">multiply(.., w)  — dispatch</text>

  <text x="170" y="336" text-anchor="middle" font-size="12" opacity="0.85">5 dispatches, 4 intermediate arrays</text>
  <text x="170" y="354" text-anchor="middle" font-size="12" opacity="0.85">round-trip to global memory each time</text>

  <text x="530" y="28" text-anchor="middle" fill="#f0c893" font-size="14">MLX (what actually happens)</text>
  <text x="530" y="46" text-anchor="middle" font-size="11" opacity="0.75">lazy graph, fused dispatch</text>

  <rect x="420" y="66" width="220" height="150" rx="10" fill="rgba(139,152,169,0.05)" stroke="#8b98a9" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="530" y="88" text-anchor="middle" font-size="12" fill="#c0cadb">the graph is built:</text>
  <text x="530" y="108" text-anchor="middle" font-size="11" opacity="0.85">square then mean then rsqrt</text>
  <text x="530" y="124" text-anchor="middle" font-size="11" opacity="0.85">then multiply then multiply</text>
  <text x="530" y="150" text-anchor="middle" font-size="11" opacity="0.75">no Metal dispatch yet</text>
  <text x="530" y="168" text-anchor="middle" font-size="11" opacity="0.75">no intermediates on GPU</text>
  <text x="530" y="196" text-anchor="middle" font-size="11" opacity="0.6">this is the "compute graph"</text>

  <path d="M 530 220 v 14" stroke="#8b98a9" stroke-opacity="0.7" fill="none" marker-end="url(#arrL)"/>
  <text x="620" y="230" font-size="11" opacity="0.7">mx::force()</text>

  <rect x="420" y="242" width="220" height="66" rx="10" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="530" y="266" text-anchor="middle" font-size="12" fill="#f0c893">1 fused Metal kernel</text>
  <text x="530" y="286" text-anchor="middle" font-size="11" opacity="0.85">whole chain in one dispatch</text>

  <text x="530" y="336" text-anchor="middle" font-size="12" opacity="0.85">1 dispatch, 0 intermediates</text>
  <text x="530" y="354" text-anchor="middle" font-size="12" opacity="0.85">the composed then fused move</text>

  <text x="360" y="374" text-anchor="middle" font-size="11" opacity="0.6">— written by us in Metal, done by MLX for the same Rust code —</text>
</svg>
