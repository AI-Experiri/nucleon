<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b98a9">
  <defs>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.8"/>
    </marker>
  </defs>

  <!-- Yamf pieces (left) -->
  <rect x="20" y="30" width="240" height="290" rx="12" fill="rgba(139,152,169,0.05)" stroke="#8b98a9" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="140" y="54" text-anchor="middle" fill="#c0cadb" font-size="14">Yamf.tokenizer (from loader)</text>

  <rect x="40" y="72" width="200" height="34" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="140" y="93" text-anchor="middle" font-size="12" fill="#f0c893">tokens: Vec&lt;String&gt;</text>

  <rect x="40" y="114" width="200" height="34" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="140" y="135" text-anchor="middle" font-size="12" fill="#f0c893">merges: Vec&lt;(String,String)&gt;</text>

  <rect x="40" y="156" width="200" height="34" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="140" y="177" text-anchor="middle" font-size="12" fill="#f0c893">token_types: Vec&lt;TokenType&gt;</text>

  <rect x="40" y="198" width="200" height="34" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="140" y="219" text-anchor="middle" font-size="12" fill="#f0c893">pre: "qwen2"</text>

  <rect x="40" y="240" width="200" height="34" rx="8" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.8"/>
  <text x="140" y="261" text-anchor="middle" font-size="12" fill="#f0c893">stop_token_ids: Vec&lt;u32&gt;</text>

  <!-- HF Tokenizer (right) -->
  <rect x="400" y="30" width="300" height="290" rx="12" fill="rgba(139,152,169,0.05)" stroke="#8b98a9" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="550" y="54" text-anchor="middle" fill="#c0cadb" font-size="14">tokenizers::Tokenizer (in memory)</text>

  <rect x="420" y="72" width="260" height="52" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="550" y="94" text-anchor="middle" font-size="12" fill="#c0cadb">Pre-tokenizer</text>
  <text x="550" y="112" text-anchor="middle" font-size="11" opacity="0.75">Split(qwen2 regex) + ByteLevel</text>

  <rect x="420" y="132" width="260" height="52" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="550" y="154" text-anchor="middle" font-size="12" fill="#c0cadb">Model</text>
  <text x="550" y="172" text-anchor="middle" font-size="11" opacity="0.75">BPE(vocab, merges)</text>

  <rect x="420" y="192" width="260" height="52" rx="8" fill="rgba(70,130,180,0.10)" stroke="#4682b4" stroke-opacity="0.7"/>
  <text x="550" y="214" text-anchor="middle" font-size="12" fill="#c0cadb">Decoder</text>
  <text x="550" y="232" text-anchor="middle" font-size="11" opacity="0.75">ByteLevel (inverse mapping)</text>

  <rect x="420" y="252" width="260" height="52" rx="8" fill="rgba(94,141,94,0.10)" stroke="#5e8d5e" stroke-opacity="0.7"/>
  <text x="550" y="274" text-anchor="middle" font-size="12" fill="#9dc49d">Added tokens</text>
  <text x="550" y="292" text-anchor="middle" font-size="11" opacity="0.75">Control + UserDefined entries</text>

  <!-- arrows: each Yamf piece to its consumer -->
  <path d="M 244 89  C 320 88, 360 96,  418 98"  stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrT)"/>
  <path d="M 244 131 C 320 148, 360 155, 418 158" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrT)"/>
  <path d="M 244 173 C 320 220, 360 260, 418 278" stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrT)"/>
  <path d="M 244 215 C 320 130, 360 100, 418 98"  stroke="#8b98a9" stroke-opacity="0.6" fill="none" marker-end="url(#arrT)"/>
  <text x="340" y="342" text-anchor="middle" font-size="11" opacity="0.7">stop_token_ids: not into the Tokenizer, kept for the loop</text>
</svg>
