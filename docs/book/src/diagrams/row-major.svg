<svg width="660" height="280" viewBox="0 0 660 280" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8b98a9">
  <text x="115" y="30" text-anchor="middle" font-weight="bold" fill="#a9b6c6">logical [2, 3] tensor</text>
  <text x="460" y="30" text-anchor="middle" font-weight="bold" fill="#a9b6c6">flat Vec&lt;f32&gt; in memory</text>
  <text x="65" y="58" text-anchor="middle" opacity="0.7" font-size="12">col 0</text>
  <text x="115" y="58" text-anchor="middle" opacity="0.7" font-size="12">col 1</text>
  <text x="165" y="58" text-anchor="middle" opacity="0.7" font-size="12">col 2</text>
  <text x="30" y="90" text-anchor="end" opacity="0.7" font-size="12">row 0</text>
  <text x="30" y="130" text-anchor="end" opacity="0.7" font-size="12">row 1</text>
  <g stroke="#8b98a9" stroke-opacity="0.6">
    <rect x="40" y="66" width="50" height="40" fill="rgba(70,130,180,0.30)"/>
    <rect x="90" y="66" width="50" height="40" fill="rgba(70,130,180,0.30)"/>
    <rect x="140" y="66" width="50" height="40" fill="rgba(70,130,180,0.30)"/>
    <rect x="40" y="106" width="50" height="40" fill="rgba(183,65,14,0.30)"/>
    <rect x="90" y="106" width="50" height="40" fill="rgba(183,65,14,0.30)"/>
    <rect x="140" y="106" width="50" height="40" fill="rgba(183,65,14,0.30)"/>
  </g>
  <g text-anchor="middle" fill="#c0cadb">
    <text x="65" y="91">a</text><text x="115" y="91">b</text><text x="165" y="91">c</text>
    <text x="65" y="131">d</text><text x="115" y="131">e</text><text x="165" y="131">f</text>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a9" opacity="0.8"/>
    </marker>
  </defs>
  <g stroke="#8b98a9" stroke-opacity="0.8" fill="none" marker-end="url(#arr)">
    <path d="M 195 86 C 250 86, 260 96, 320 100"/>
    <path d="M 195 126 C 280 126, 350 155, 455 130"/>
  </g>
  <g stroke="#8b98a9" stroke-opacity="0.6">
    <rect x="325" y="86" width="44" height="40" fill="rgba(70,130,180,0.30)"/>
    <rect x="369" y="86" width="44" height="40" fill="rgba(70,130,180,0.30)"/>
    <rect x="413" y="86" width="44" height="40" fill="rgba(70,130,180,0.30)"/>
    <rect x="457" y="86" width="44" height="40" fill="rgba(183,65,14,0.30)"/>
    <rect x="501" y="86" width="44" height="40" fill="rgba(183,65,14,0.30)"/>
    <rect x="545" y="86" width="44" height="40" fill="rgba(183,65,14,0.30)"/>
  </g>
  <g text-anchor="middle" fill="#c0cadb">
    <text x="347" y="111">a</text><text x="391" y="111">b</text><text x="435" y="111">c</text>
    <text x="479" y="111">d</text><text x="523" y="111">e</text><text x="567" y="111">f</text>
  </g>
  <g text-anchor="middle" opacity="0.7" font-size="12">
    <text x="347" y="144">0</text><text x="391" y="144">1</text><text x="435" y="144">2</text>
    <text x="479" y="144">3</text><text x="523" y="144">4</text><text x="567" y="144">5</text>
  </g>
  <g text-anchor="middle" font-size="12" opacity="0.8">
    <text x="391" y="166">row 0</text>
    <text x="523" y="166">row 1</text>
  </g>
  <text x="330" y="215" text-anchor="middle" fill="#a9b6c6">element [i, j] lives at flat position i * 3 + j</text>
  <text x="330" y="242" text-anchor="middle" opacity="0.8">e.g. [1, 2] = f : 1 * 3 + 2 = 5</text>
</svg>
