  </g>

  <text x="140" y="352" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.7">no per-head norm inside attention</text>

  <!-- vertical divider -->
  <line x1="325" y1="70" x2="325" y2="360" stroke="#8b98a9" stroke-opacity="0.25" stroke-dasharray="4 3"/>

  <!-- RIGHT PANEL: Qwen3 -->
  <text x="565" y="76" text-anchor="middle" font-size="13" fill="#c0cadb">Qwen3</text>
  <text x="565" y="94" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">head_dim = 128 explicit; 8 KV heads (GQA); QK-norm on Q and K</text>

  <!-- Panel R reference: hidden bar -->
  <rect x="365" y="116" width="205" height="10" rx="2" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.6" stroke-dasharray="3 2"/>
  <text x="467" y="145" text-anchor="middle" font-size="11" fill="#e0a458" opacity="0.85">hidden = 1024 (unchanged)</text>

  <!-- Panel R Q row: 16 heads × 128 → 16 boxes, 24.6 px wide -->
  <text x="365" y="176" font-size="11" fill="#c0cadb">Q &#183; 16 heads × 128 = 2048   ← WIDER than hidden (the head_dim landmine)</text>
  <g fill="rgba(70,130,180,0.35)" stroke="#4682b4" stroke-opacity="0.7">
    <rect x="365"   y="184" width="24.6" height="26" rx="2"/>
    <rect x="390.6" y="184" width="24.6" height="26" rx="2"/>
    <rect x="416.2" y="184" width="24.6" height="26" rx="2"/>
    <rect x="441.8" y="184" width="24.6" height="26" rx="2"/>
    <rect x="467.4" y="184" width="24.6" height="26" rx="2"/>
