  <!-- Panel L K row -->
  <text x="40" y="236" font-size="11" fill="#c0cadb">K &#183; 16 heads × 64 = 1024</text>
  <g fill="rgba(70,130,180,0.35)" stroke="#4682b4" stroke-opacity="0.7">
    <rect x="40"    y="244" width="11.8" height="26" rx="2"/>
    <rect x="52.8"  y="244" width="11.8" height="26" rx="2"/>
