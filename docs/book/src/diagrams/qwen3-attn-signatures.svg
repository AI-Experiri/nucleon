    <rect x="219.2" y="244" width="11.8" height="26" rx="2"/>
    <rect x="232.0" y="244" width="11.8" height="26" rx="2"/>
  </g>

  <!-- Panel L V row -->
  <text x="40" y="296" font-size="11" fill="#c0cadb">V &#183; 16 heads × 64 = 1024</text>
  <g fill="rgba(70,130,180,0.35)" stroke="#4682b4" stroke-opacity="0.7">
    <rect x="40"    y="304" width="11.8" height="26" rx="2"/>
    <rect x="52.8"  y="304" width="11.8" height="26" rx="2"/>
    <rect x="65.6"  y="304" width="11.8" height="26" rx="2"/>
    <rect x="78.4"  y="304" width="11.8" height="26" rx="2"/>
    <rect x="91.2"  y="304" width="11.8" height="26" rx="2"/>
    <rect x="104.0" y="304" width="11.8" height="26" rx="2"/>
