<svg width="820" height="580" viewBox="0 0 820 580" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b98a9">
  <defs>
    <marker id="arrSig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0a458" opacity="0.9"/>
    </marker>
  </defs>

  <text x="410" y="24" text-anchor="middle" font-size="14" fill="#c0cadb">Qwen3's two departures from the canonical attention shape</text>
  <text x="410" y="42" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">shapes drawn to scale — 1 head_dim unit = 0.2 px, so widths ARE the numbers</text>

  <!-- LEFT PANEL: canonical MHA -->
  <text x="140" y="76" text-anchor="middle" font-size="13" fill="#c0cadb">Canonical MHA (Vaswani, 2017)</text>
  <text x="140" y="94" text-anchor="middle" font-size="11" fill="#8b98a9" opacity="0.85">if applied to Qwen3: head_dim = 1024 / 16 = 64</text>

  <!-- Panel L reference: hidden bar (orange accent, like residual in other diagrams) -->
  <rect x="40" y="116" width="205" height="10" rx="2" fill="rgba(224,164,88,0.10)" stroke="#e0a458" stroke-opacity="0.6" stroke-dasharray="3 2"/>
  <text x="142" y="145" text-anchor="middle" font-size="11" fill="#e0a458" opacity="0.85">hidden = 1024</text>

  <!-- Panel L Q row: 16 heads × 64 → 16 boxes, 11.8 px wide + 1 px gap -->
  <text x="40" y="176" font-size="11" fill="#c0cadb">Q &#183; 16 heads × 64 = 1024</text>
  <g fill="rgba(70,130,180,0.35)" stroke="#4682b4" stroke-opacity="0.7">
    <rect x="40"    y="184" width="11.8" height="26" rx="2"/>
