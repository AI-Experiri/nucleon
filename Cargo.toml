[workspace]
resolver = "2"
members = ["nucleon", "nucleon-mlx"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
half = { version = "2.7", features = ["bytemuck"] }
minijinja = { version = "2", features = ["json", "fuel"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
mlx-rs = "=0.25.3"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
